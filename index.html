let searchTimer = null;
userSearchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const term = userSearchInput.value.trim().toLowerCase();
  if (!term) { searchResultsEl.innerHTML = ''; return; }
  searchTimer = setTimeout(() => runSearch(term), 300);
});

async function runSearch(term) {
  try {
    const [usersSnap, groupsSnap] = await Promise.all([
      db.collection('users').where('username_lower','>=',term).where('username_lower','<=',term+'\uf8ff').limit(10).get(),
      db.collection('groups').where('nameLower','>=',term).where('nameLower','<=',term+'\uf8ff').limit(5).get()
    ]);

    searchResultsEl.innerHTML = '';
    const users = usersSnap.docs.filter(d => d.id !== currentUser.uid);
    const groups = groupsSnap.docs.filter(d => {
      const data = d.data();
      return (data.members || []).includes(currentUser.uid) || data.isChannel;
    });

    if (!users.length && !groups.length) {
      const es = document.createElement('div');
      es.className = 'empty-state';
      es.innerHTML = `<p>No results found</p>`;
      searchResultsEl.appendChild(es);
      return;
    }

    groups.forEach(doc => {
      const g = doc.data();
      const isMember = (g.members || []).includes(currentUser.uid);
      const label = g.isChannel ? 'Channel' : 'Group';
      const subText = g.isChannel ? `${(g.members||[]).length} subscribers` : `${(g.members||[]).length} members`;
      const row = buildUserRow({username: g.name, photoURL: g.photoURL}, subText, false, null, true, label);
      row.addEventListener('click', async () => {
        if (!isMember) {
          await db.collection('groups').doc(doc.id).update({ members: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
          g.members = [...(g.members||[]), currentUser.uid];
        }
        openGroupChat(doc.id, g);
      });
      searchResultsEl.appendChild(row);
    });

    users.forEach(doc => {
      const u = doc.data();
      const row = buildUserRow(u, u.email || '', false);
      row.addEventListener('click', () => openChatWith(u));
      searchResultsEl.appendChild(row);
    });
  } catch(err) {
    console.error(err);
  }
}

/* ===== CHATS LIST ===== */
const partnerCache = {};

function listenToChatsList() {
  const q = db.collection('chats').where('participants','array-contains', currentUser.uid);
  const gq = db.collection('groups').where('members','array-contains', currentUser.uid);

  let privateDocs = [], groupDocs = [];

  function renderAll() {
    const allItems = [];
    privateDocs.forEach(doc => {
      const chat = doc.data();
      const partnerUid = (chat.participants||[]).find(id => id !== currentUser.uid);
      const partner = partnerUid && partnerCache[partnerUid];
      if (!partner) return;
      if (chat.deletedBy && chat.deletedBy[currentUser.uid]) return;
      allItems.push({ type:'private', chatId:doc.id, chat, partner, ts: chat.lastMessageAt });
    });
    groupDocs.forEach(doc => {
      const g = doc.data();
      allItems.push({ type: g.isChannel ? 'channel' : 'group', chatId:doc.id, group:g, ts: g.lastMessageAt });
    });

    allItems.sort((a,b) => {
      // Pinned first
      const ap = a.type === 'private' ? (a.chat.pinnedBy && a.chat.pinnedBy[currentUser.uid]) : (a.group && a.group.pinnedBy && a.group.pinnedBy[currentUser.uid]);
      const bp = b.type === 'private' ? (b.chat.pinnedBy && b.chat.pinnedBy[currentUser.uid]) : (b.group && b.group.pinnedBy && b.group.pinnedBy[currentUser.uid]);
      if (ap && !bp) return -1;
      if (!ap && bp) return 1;
      const at = a.ts && a.ts.toMillis ? a.ts.toMillis() : 0;
      const bt = b.ts && b.ts.toMillis ? b.ts.toMillis() : 0;
      return bt - at;
    });

    latestChatItems = allItems;
    renderFolderTabs();

    const archivedList = document.getElementById('archived-list');
    const archiveToggleRow = document.getElementById('archive-toggle-row');
    const archiveBadge = document.getElementById('archive-badge');
    chatsListEl.innerHTML = '';
    archivedList.innerHTML = '';

    const archived = allItems.filter(i => (i.chat && i.chat.archivedBy && i.chat.archivedBy[currentUser.uid]) || (i.group && i.group.archivedBy && i.group.archivedBy[currentUser.uid]));
    let normal = allItems.filter(i => !archived.includes(i));
    normal = applyFolderFilter(normal);

    if (archived.length > 0) {
      archiveToggleRow.style.display = 'flex';
      archiveBadge.textContent = archived.length;
    } else {
      archiveToggleRow.style.display = 'none';
      archivedList.style.display = 'none';
      archiveToggleRow.classList.remove('open');
    }

    if (!normal.length && !archived.length) {
      const es = document.createElement('div');
      es.className = 'empty-state';
      es.innerHTML = `<p>No chats yet.<br>Search for a user to start.</p>`;
      chatsListEl.appendChild(es);
    } else if (!normal.length) {
      const es = document.createElement('div');
      es.className = 'empty-state';
      es.innerHTML = `<p>No chats in this folder.</p>`;
      chatsListEl.appendChild(es);
    }

    function buildRow(item, container) {
      let row;
      if (item.type === 'private') {
        const { chatId, chat, partner } = item;
        const unread = (chat.unreadCounts && chat.unreadCounts[currentUser.uid]) || 0;
        const pinned = !!(chat.pinnedBy && chat.pinnedBy[currentUser.uid]);
        row = buildUserRow(partner, chat.lastMessage || '', true, formatListTime(chat.lastMessageAt), false, null, unread, pinned);
        row.dataset.chatId = chatId;
        if (chatId === activeChatId) row.classList.add('active');
        addRowContextMenu(row, chatId, item.type, item);
        row.addEventListener('click', () => openChatWith(partner));
      } else {
        const { chatId, group } = item;
        const label = group.isChannel ? 'Channel' : 'Group';
        const subText = group.isChannel ? (group.lastMessage || `${(group.members||[]).length} subscribers`) : (group.lastMessage || '');
        const unread = (group.unreadCounts && group.unreadCounts[currentUser.uid]) || 0;
        const pinned = !!(group.pinnedBy && group.pinnedBy[currentUser.uid]);
        row = buildUserRow({username: group.name, photoURL: group.photoURL}, subText, false, formatListTime(group.lastMessageAt), true, label, unread, pinned);
        row.dataset.chatId = chatId;
        if (chatId === activeChatId) row.classList.add('active');
        addRowContextMenu(row, chatId, item.type === 'channel' ? 'group' : item.type, item);
        row.addEventListener('click', () => openGroupChat(chatId, group));
      }
      container.appendChild(row);
    }

    normal.forEach(item => buildRow(item, chatsListEl));
    archived.forEach(item => buildRow(item, archivedList));
  }

  unsubChatsList = q.onSnapshot(async snap => {
    const fetches = snap.docs.map(async doc => {
      const chat = doc.data();
      const partnerUid = (chat.participants||[]).find(id => id !== currentUser.uid);
      if (!partnerUid) return;
      if (!partnerCache[partnerUid]) {
        const ps = await db.collection('users').doc(partnerUid).get();
        if (ps.exists) partnerCache[partnerUid] = ps.data();
      }
    });
    await Promise.all(fetches);
    privateDocs = snap.docs;
    renderAll();
  }, err => console.error('Chats list error:', err));

  db.collection('groups').where('members','array-contains', currentUser.uid)
    .onSnapshot(snap => {
      groupDocs = snap.docs;
      renderAll();
    }, err => console.error('Groups list error:', err));
}

/* ===== FOLDERS ===== */
function getFolders() {
  return (currentUserData && currentUserData.folders) || [];
}

function applyFolderFilter(items) {
  if (activeFolder === 'all') return items;
  if (activeFolder === 'private') return items.filter(i => i.type === 'private');
  if (activeFolder === 'group') return items.filter(i => i.type === 'group');
  if (activeFolder === 'channel') return items.filter(i => i.type === 'channel');
  const f = getFolders().find(f => f.id === activeFolder);
  if (!f) return items;
  return items.filter(i => (f.chatIds || []).includes(i.chatId));
}

function renderFolderTabs() {
  const bar = document.getElementById('folder-tabs');
  if (!bar) return;
  bar.innerHTML = '';

  const builtIns = [
    { id: 'all', name: 'All' },
    { id: 'private', name: 'Private' },
    { id: 'group', name: 'Groups' },
    { id: 'channel', name: 'Channels' }
  ];

  builtIns.concat(getFolders()).forEach(f => {
    const tab = document.createElement('button');
    tab.className = 'folder-tab' + (activeFolder === f.id ? ' active' : '');
    tab.textContent = f.name;
    tab.addEventListener('click', () => { activeFolder = f.id; renderActiveFolderUI(); });
    if (!builtIns.includes(f)) {
      tab.addEventListener('contextmenu', e => { e.preventDefault(); confirmDeleteFolder(f.id, f.name); });
      let pt = null;
      tab.addEventListener('touchstart', () => { pt = setTimeout(() => confirmDeleteFolder(f.id, f.name), 600); }, { passive: true });
      tab.addEventListener('touchend', () => clearTimeout(pt));
    }
    bar.appendChild(tab);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'folder-tab-add';
  addBtn.title = 'New Folder';
  addBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
  addBtn.addEventListener('click', () => showCreateFolderModal());
  bar.appendChild(addBtn);
}

function renderActiveFolderUI() {
  document.querySelectorAll('.folder-tab').forEach(t => t.classList.remove('active'));
  // Re-render list with current cached items
  const archivedList = document.getElementById('archived-list');
  const archived = latestChatItems.filter(i => (i.chat && i.chat.archivedBy && i.chat.archivedBy[currentUser.uid]) || (i.group && i.group.archivedBy && i.group.archivedBy[currentUser.uid]));
  let normal = latestChatItems.filter(i => !archived.includes(i));
  normal = applyFolderFilter(normal);
  chatsListEl.innerHTML = '';
  renderFolderTabs();
  if (!normal.length) {
    const es = document.createElement('div');
    es.className = 'empty-state';
    es.innerHTML = `<p>No chats in this folder.</p>`;
    chatsListEl.appendChild(es);
    return;
  }
  normal.forEach(item => {
    let row;
    if (item.type === 'private') {
      const unread = (item.chat.unreadCounts && item.chat.unreadCounts[currentUser.uid]) || 0;
      const pinned = !!(item.chat.pinnedBy && item.chat.pinnedBy[currentUser.uid]);
      row = buildUserRow(item.partner, item.chat.lastMessage || '', true, formatListTime(item.chat.lastMessageAt), false, null, unread, pinned);
      row.dataset.chatId = item.chatId;
      if (item.chatId === activeChatId) row.classList.add('active');
      addRowContextMenu(row, item.chatId, item.type, item);
      row.addEventListener('click', () => openChatWith(item.partner));
    } else {
      const label = item.group.isChannel ? 'Channel' : 'Group';
      const subText = item.group.isChannel ? (item.group.lastMessage || `${(item.group.members||[]).length} subscribers`) : (item.group.lastMessage || '');
      const unread = (item.group.unreadCounts && item.group.unreadCounts[currentUser.uid]) || 0;
      const pinned = !!(item.group.pinnedBy && item.group.pinnedBy[currentUser.uid]);
      row = buildUserRow({username: item.group.name, photoURL: item.group.photoURL}, subText, false, formatListTime(item.group.lastMessageAt), true, label, unread, pinned);
      row.dataset.chatId = item.chatId;
      if (item.chatId === activeChatId) row.classList.add('active');
      addRowContextMenu(row, item.chatId, item.type === 'channel' ? 'group' : item.type, item);
      row.addEventListener('click', () => openGroupChat(item.chatId, item.group));
    }
    chatsListEl.appendChild(row);
  });
}

function showCreateFolderModal() {
  const modal = createModal('New Folder');
  const body = modal.querySelector('.modal-body');
  const footer = modal.querySelector('.modal-footer');

  const nameLabel = document.createElement('span');
  nameLabel.className = 'modal-label';
  nameLabel.textContent = 'Folder Name';
  body.appendChild(nameLabel);

  const nameInp = document.createElement('input');
  nameInp.className = 'modal-input';
  nameInp.placeholder = 'e.g. Work, Friends, Updates…';
  body.appendChild(nameInp);

  const pickLabel = document.createElement('span');
  pickLabel.className = 'modal-label';
  pickLabel.style.marginTop = '14px';
  pickLabel.textContent = 'Include Chats';
  body.appendChild(pickLabel);

  const pickList = document.createElement('div');
  pickList.style.cssText = 'max-height:260px;overflow-y:auto;';
  body.appendChild(pickList);

  const selectedIds = new Set();

  if (!latestChatItems.length) {
    pickList.innerHTML = '<div class="empty-state" style="padding:14px 0;"><p>No chats yet to add.</p></div>';
  }

  latestChatItems.forEach(item => {
    const row = document.createElement('label');
    row.className = 'folder-pick-row';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.addEventListener('change', () => { cb.checked ? selectedIds.add(item.chatId) : selectedIds.delete(item.chatId); });
    row.appendChild(cb);
    const av = document.createElement('div');
    av.className = 'avatar';
    av.style.cssText = 'width:30px;height:30px;font-size:12px;flex-shrink:0';
    const name = item.type === 'private' ? (item.partner.username || 'User') : item.group.name;
    const photo = item.type === 'private' ? item.partner.photoURL : item.group.photoURL;
    setAvatarContent(av, name, photo);
    row.appendChild(av);
    const info = document.createElement('div');
    info.style.cssText = 'flex:1;font-size:13.5px;font-weight:600;';
    info.textContent = name;
    row.appendChild(info);
    const tag = document.createElement('span');
    tag.style.cssText = 'font-size:10.5px;color:var(--text-muted);text-transform:uppercase;font-weight:700;';
    tag.textContent = item.type === 'channel' ? 'Channel' : (item.type === 'group' ? 'Group' : 'Private');
    row.appendChild(tag);
    pickList.appendChild(row);
  });

  const createBtn = document.createElement('button');
  createBtn.className = 'btn-full btn-blue';
  createBtn.textContent = 'Create Folder';
  footer.appendChild(createBtn);

  createBtn.addEventListener('click', async () => {
    const name = nameInp.value.trim();
    if (!name) { alert('Enter a folder name'); return; }
    const folder = { id: 'f_' + Date.now(), name, chatIds: Array.from(selectedIds) };
    const folders = getFolders().concat([folder]);
    try {
      await db.collection('users').doc(currentUser.uid).update({ folders });
      currentUserData.folders = folders;
      closeModal();
      renderFolderTabs();
      showToast('Folder created');
    } catch(err) { alert('Failed to create folder: ' + friendlyError(err)); }
  });
}

function confirmDeleteFolder(folderId, name) {
  if (!confirm(`Delete folder "${name}"?`)) return;
  const folders = getFolders().filter(f => f.id !== folderId);
  db.collection('users').doc(currentUser.uid).update({ folders }).then(() => {
    currentUserData.folders = folders;
    if (activeFolder === folderId) activeFolder = 'all';
    renderActiveFolderUI();
    showToast('Folder deleted');
  }).catch(err => alert('Error: ' + friendlyError(err)));
}

/* ===== OPEN PRIVATE CHAT ===== */
async function openChatWith(partnerData) {
  if (!partnerData.uid || partnerData.uid === currentUser.uid) return;
  closeAllPopups();
  clearReply();

  const chatId = getChatId(currentUser.uid, partnerData.uid);
  activeChatId = chatId;
  activeChatPartner = partnerData;
  activeChatIsGroup = false;
  activeChatIsChannel = false;
  activeChatIsAdmin = false;
  messageForm.style.display = 'flex';
  const lockBar0 = document.getElementById('channel-locked-bar');
  if (lockBar0) lockBar0.style.display = 'none';
  // Hide pinned bar for private chats
  pinnedBar.classList.add('hidden');
  if (unsubPinnedMsg) { unsubPinnedMsg(); unsubPinnedMsg = null; }

  const chatRef = db.collection('chats').doc(chatId);
  const chatSnap = await chatRef.get();
  if (!chatSnap.exists) {
    await chatRef.set({
      participants: [currentUser.uid, partnerData.uid],
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastMessage: '', lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  // Reset own unread count and set lastReadAt
  chatRef.update({
    [`unreadCounts.${currentUser.uid}`]: 0,
    [`lastReadAt.${currentUser.uid}`]: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(()=>{});

  // Listen for partner's lastReadAt (read receipts)
  if (unsubChatDoc) { unsubChatDoc(); unsubChatDoc = null; }
  if (unsubGroupTyping) { unsubGroupTyping(); unsubGroupTyping = null; }
  partnerReadAt = null;
  unsubChatDoc = chatRef.onSnapshot(snap => {
    if (!snap.exists) return;
    const d = snap.data();
    const pra = d.lastReadAt && d.lastReadAt[partnerData.uid];
    if (pra) {
      partnerReadAt = pra.toDate ? pra.toDate() : new Date(pra);
      // Update all visible sent message ticks
      document.querySelectorAll('.msg-tick[data-msg-ts]').forEach(tick => {
        const ts = parseInt(tick.dataset.msgTs);
        if (!isNaN(ts) && partnerReadAt && partnerReadAt.getTime() >= ts) {
          tick.classList.remove('delivered');
          tick.classList.add('seen');
          tick.innerHTML = seenSVG();
          tick.title = 'Seen';
        }
      });
    }
    // Typing indicator
    const typingVal = d.typing && d.typing[partnerData.uid];
    const isTypingNow = !!(typingVal && typingVal.toMillis && (Date.now() - typingVal.toMillis()) < 6000);
    if (isTypingNow) {
      chatWithStatus.innerHTML = 'typing<span class="typing-dots"><span></span><span></span><span></span></span>';
      chatWithStatus.classList.add('typing');
    } else {
      chatWithStatus.classList.remove('typing');
      const online = !!(activeChatPartner && activeChatPartner.online);
      chatWithStatus.textContent = online ? 'online' : 'offline';
    }
  });

  chatEmpty.classList.add('hidden');
  chatActive.classList.remove('hidden');
  setAvatarContent(chatAvatar, partnerData.username, partnerData.photoURL);
  chatWithUsername.textContent = partnerData.username;
  chatWithStatus.textContent = 'offline';
  chatWithStatus.className = 'chat-with-status';
  chatStatusDot.className = 'status-dot';
  document.getElementById('chat-status-dot').style.display = '';

  // Header actions for private chat (none extra)
  document.getElementById('chat-header-actions').innerHTML = '';

  document.querySelectorAll('.user-row').forEach(r => r.classList.remove('active'));
  const activeRow = chatsListEl.querySelector(`[data-chat-id="${chatId}"]`);
  if (activeRow) activeRow.classList.add('active');

  if (window.innerWidth <= 768) { sidebar.classList.add('hide-mobile'); var _nav=document.getElementById('mobile-nav'); if(_nav) _nav.style.display='none'; }
  userSearchInput.value = '';
  searchResultsEl.innerHTML = '';

  // Make header clickable to view profile
  document.getElementById('chat-header-info-btn').onclick = () => showPartnerProfile(partnerData);

  listenToMessages(chatId, false);
  listenToPartnerStatus(partnerData.uid);
}

/* ===== OPEN GROUP CHAT ===== */
async function openGroupChat(groupId, groupData) {
  closeAllPopups();
  clearReply();

  activeChatId = groupId;
  activeChatPartner = groupData;
  activeChatIsGroup = true;

  // Refresh group data
  const gs = await db.collection('groups').doc(groupId).get();
  if (!gs.exists) return;
  const g = gs.data();
  activeChatPartner = g;
  activeChatIsChannel = !!g.isChannel;
  const admins = g.admins || [g.createdBy];
  const isAdminUser = admins.includes(currentUser.uid) || g.createdBy === currentUser.uid;
  activeChatIsAdmin = isAdminUser;

  chatEmpty.classList.add('hidden');
  chatActive.classList.remove('hidden');
  setAvatarContent(chatAvatar, g.name, g.photoURL);
  chatWithUsername.textContent = g.name;
  chatWithStatus.className = 'chat-with-status';
  chatWithStatus.textContent = activeChatIsChannel ? `${(g.members||[]).length} subscribers` : `${(g.members||[]).length} members`;
  document.getElementById('chat-status-dot').style.display = 'none';

  // Header actions: group/channel settings
  const acts = document.getElementById('chat-header-actions');
  acts.innerHTML = '';
  if ((!activeChatIsChannel && g.createdBy === currentUser.uid) || (activeChatIsChannel && isAdminUser)) {
    const settingsBtn = document.createElement('button');
    settingsBtn.className = 'icon-btn';
    settingsBtn.title = activeChatIsChannel ? 'Channel Settings' : 'Group Settings';
    settingsBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
    settingsBtn.addEventListener('click', () => activeChatIsChannel ? showChannelSettings(groupId, g) : showGroupSettings(groupId, g));
    acts.appendChild(settingsBtn);
  }

  // Header info click
  document.getElementById('chat-header-info-btn').onclick = () => activeChatIsChannel ? showChannelSettings(groupId, activeChatPartner) : showGroupSettings(groupId, activeChatPartner);

  // Lock composer for channel non-admins
  const lockBar = document.getElementById('channel-locked-bar');
  if (activeChatIsChannel && !isAdminUser) {
    messageForm.style.display = 'none';
    if (lockBar) lockBar.style.display = 'flex';
  } else {
    messageForm.style.display = 'flex';
    if (lockBar) lockBar.style.display = 'none';
  }

  document.querySelectorAll('.user-row').forEach(r => r.classList.remove('active'));
  const activeRow = chatsListEl.querySelector(`[data-chat-id="${groupId}"]`);
  if (activeRow) activeRow.classList.add('active');
  if (window.innerWidth <= 768) { sidebar.classList.add('hide-mobile'); var _nav=document.getElementById('mobile-nav'); if(_nav) _nav.style.display='none'; }
  userSearchInput.value = '';
  searchResultsEl.innerHTML = '';

  listenToMessages(groupId, true);
  if (unsubPartnerStatus) { unsubPartnerStatus(); unsubPartnerStatus = null; }
  if (unsubChatDoc) { unsubChatDoc(); unsubChatDoc = null; }
  if (unsubGroupTyping) { unsubGroupTyping(); unsubGroupTyping = null; }
  partnerReadAt = null;

  // Listen for typing users in the group
  unsubGroupTyping = db.collection('groups').doc(groupId).onSnapshot(snap => {
    if (!snap.exists) return;
    const d = snap.data();
    const typingMap = d.typing || {};
    const now = Date.now();
    const typingUsernames = Object.entries(typingMap)
      .filter(([uid, ts]) => uid !== currentUser.uid && ts && ts.toMillis && (now - ts.toMillis()) < 6000)
      .map(([uid]) => (d.typingNames && d.typingNames[uid]) || 'Someone');
    if (typingUsernames.length) {
      chatWithStatus.innerHTML = typingUsernames.slice(0,2).join(', ') + ' typing<span class="typing-dots"><span></span><span></span><span></span></span>';
      chatWithStatus.classList.add('typing');
    } else {
      chatWithStatus.classList.remove('typing');
      chatWithStatus.textContent = activeChatIsChannel ? `${(d.members||[]).length} subscribers` : `${(d.members||[]).length} members`;
    }
  });

  // Reset own unread + set lastReadAt for group
  db.collection('groups').doc(groupId).update({
    [`unreadCounts.${currentUser.uid}`]: 0,
    [`lastReadAt.${currentUser.uid}`]: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(()=>{});

  // Listen to pinned message for channels
  if (unsubPinnedMsg) { unsubPinnedMsg(); unsubPinnedMsg = null; }
  if (activeChatIsChannel) {
    unsubPinnedMsg = db.collection('groups').doc(groupId).onSnapshot(snap => {
      if (!snap.exists) return;
      const data = snap.data();
      if (data.pinnedMessageId && data.pinnedMessageText) {
        pinnedBarText.textContent = data.pinnedMessageText;
        pinnedBar.classList.remove('hidden');
        // Only show close (unpin) button for admins
        pinnedBarClose.style.display = activeChatIsAdmin ? '' : 'none';
      } else {
        pinnedBar.classList.add('hidden');
      }
    });
    // Scroll to pinned message on click
    pinnedBar.onclick = (e) => {
      if (e.target.closest('#pinned-bar-close')) return;
    };
  } else {
    pinnedBar.classList.add('hidden');
  }
}

/* ===== PARTNER STATUS ===== */
function listenToPartnerStatus(partnerUid) {
  if (unsubPartnerStatus) unsubPartnerStatus();
  unsubPartnerStatus = db.collection('users').doc(partnerUid).onSnapshot(doc => {
    if (!doc.exists) return;
    const online = !!doc.data().online;
    chatWithStatus.textContent = online ? 'online' : 'offline';
    chatWithStatus.classList.toggle('online', online);
    chatStatusDot.classList.toggle('online', online);
    // Update avatar in case photo changed
    setAvatarContent(chatAvatar, doc.data().username, doc.data().photoURL);
    activeChatPartner = doc.data();
  });
}

/* ===== MESSAGES ===== */
function listenToMessages(chatId, isGroup) {
  if (unsubMessages) unsubMessages();
  messagesEl.innerHTML = '';
  currentChatMessages = [];
  closeChatSearch();
  const col = isGroup ? 'groups' : 'chats';

  unsubMessages = db.collection(col).doc(chatId)
    .collection('messages').orderBy('createdAt','asc')
    .onSnapshot(snap => {
      messagesEl.innerHTML = '';
      currentChatMessages = [];
      let lastDate = null;
      snap.forEach(doc => {
        const msg = doc.data();
        if (msg.createdAt && msg.createdAt.toDate) {
          const dateStr = msg.createdAt.toDate().toDateString();
          if (dateStr !== lastDate) {
            lastDate = dateStr;
            const sep = document.createElement('div');
            sep.className = 'date-separator';
            const lbl = document.createElement('span');
            const d = msg.createdAt.toDate();
            const today = new Date();
            lbl.textContent = d.toDateString() === today.toDateString()
              ? 'Today'
              : d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
            sep.appendChild(lbl);
            messagesEl.appendChild(sep);
          }
        }
        renderMessage(msg, doc.id, chatId, isGroup);
        const justRenderedRow = messagesEl.lastElementChild;
        const justRenderedBubble = justRenderedRow && justRenderedRow.querySelector('.bubble');
        if (justRenderedBubble) {
          const searchableText = msg.text || (msg.type === 'file' ? (msg.fileName || '') : '') || (msg.type === 'poll' ? (msg.pollQuestion || '') : '');
          currentChatMessages.push({ id: doc.id, text: searchableText, el: justRenderedBubble });
        }
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }, err => console.error('Messages error:', err));
}

/* ===== READ RECEIPT HELPERS ===== */
function deliveredSVG() {
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
}
function seenSVG() {
  return `<svg width="16" height="14" viewBox="0 0 28 14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 1 9 12 4 7"/><polyline points="26 1 15 12 10 7"/></svg>`;
}

function renderMessage(msg, msgId, chatId, isGroup) {
  const row = document.createElement('div');
  const isSent = msg.senderId === currentUser.uid;
  row.className = 'message-row ' + (isSent ? 'sent' : 'received');

  // For channels, all posts are "received" style (left-aligned) for non-admins, but admins sent posts go right
  const isChannel = activeChatIsChannel;
  const isAdminCtx = activeChatIsAdmin;
  const commentsOff = !!msg.commentsDisabled;
  const reactionsOff = !!msg.reactionsDisabled;

  const bubbleWrap = document.createElement('div');
  bubbleWrap.className = 'bubble-wrap';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  // Group sender name (for received messages in groups)
  if (isGroup && !isSent && msg.senderUsername) {
    const senderName = document.createElement('div');
    senderName.className = 'group-sender-name';
    senderName.textContent = msg.senderUsername;
    bubble.appendChild(senderName);
  }

  // Reply quote
  if (msg.replyTo) {
    const quote = document.createElement('div');
    quote.className = 'reply-quote';
    const qName = document.createElement('div');
    qName.className = 'reply-quote-name';
    qName.textContent = msg.replyTo.senderUsername;
    const qText = document.createElement('div');
    qText.className = 'reply-quote-text';
    qText.textContent = msg.replyTo.text || (msg.replyTo.type === 'file' ? '📎 File' : '');
    quote.appendChild(qName);
    quote.appendChild(qText);
    bubble.appendChild(quote);
  }

  // Content based on type
  if (msg.type === 'file') {
    const fa = document.createElement('div');
    fa.className = 'file-attachment';
    fa.innerHTML = `<div class="file-attachment-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
    </div>
    <div class="file-attachment-info">
      <div class="file-attachment-name">${msg.fileName || 'File'}</div>
      <div class="file-attachment-size">${msg.fileSize ? formatBytes(msg.fileSize) : ''}</div>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;color:var(--text-muted)">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>`;
    if (msg.fileURL) fa.addEventListener('click', () => window.open(msg.fileURL, '_blank'));
    bubble.appendChild(fa);
  } else if (msg.type === 'poll') {
    bubble.appendChild(renderPollWidget(msg, msgId, chatId, isGroup));
  } else {
    const textNode = document.createElement('span');
    textNode.textContent = msg.text || '';
    bubble.appendChild(textNode);
  }

  bubbleWrap.appendChild(bubble);

  // Actions
  const actions = document.createElement('div');
  actions.className = 'msg-actions';

  // Reply button — hidden if commentsDisabled
  if (!commentsOff) {
    const replyBtn = document.createElement('button');
    replyBtn.type = 'button';
    replyBtn.className = 'msg-action-btn';
    replyBtn.title = 'Reply';
    replyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>`;
    replyBtn.addEventListener('click', () => startReply(msgId, msg));
    actions.appendChild(replyBtn);
  }

  // Emoji reaction button — hidden if reactionsDisabled
  if (!reactionsOff) {
    const reactBtn = document.createElement('button');
    reactBtn.type = 'button';
    reactBtn.className = 'msg-action-btn';
    reactBtn.title = 'React';
    reactBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`;
    reactBtn.addEventListener('click', (e) => showReactionPicker(e, msgId, chatId, isGroup));
    actions.appendChild(reactBtn);
  }

  if (isSent && msgId && msg.type !== 'poll') {
    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'msg-action-btn';
    editBtn.title = 'Edit';
    editBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>`;
    editBtn.addEventListener('click', () => startEditMessage(bubble, msgId, chatId, isGroup, msg.text));
    actions.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'msg-action-btn danger';
    delBtn.title = 'Delete';
    delBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`;
    delBtn.addEventListener('click', () => deleteMessage(msgId, chatId, isGroup));
    actions.appendChild(delBtn);
  }

  // Channel admin extra actions: pin, toggle comments, toggle reactions
  if (isChannel && isAdminCtx && msgId) {
    // Pin button
    const pinBtn = document.createElement('button');
    pinBtn.type = 'button';
    pinBtn.className = 'msg-action-btn';
    pinBtn.title = 'Pin message';
    pinBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24z"/></svg>`;
    pinBtn.style.color = 'var(--text-muted)';
    pinBtn.addEventListener('click', () => {
      const msgText = msg.text || (msg.type === 'file' ? '📎 ' + (msg.fileName || 'File') : msg.type === 'poll' ? '📊 ' + msg.pollQuestion : '');
      pinMessage(msgId, msgText);
    });
    actions.appendChild(pinBtn);

    // Toggle comments button
    const toggleCommentBtn = document.createElement('button');
    toggleCommentBtn.type = 'button';
    toggleCommentBtn.className = 'msg-action-btn';
    toggleCommentBtn.title = commentsOff ? 'Enable comments' : 'Disable comments';
    toggleCommentBtn.style.color = commentsOff ? 'var(--error)' : 'var(--text-muted)';
    toggleCommentBtn.innerHTML = commentsOff
      ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="4" y1="4" x2="20" y2="20" stroke-width="2.5"/></svg>`
      : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
    toggleCommentBtn.addEventListener('click', () => toggleChannelFeature(msgId, chatId, 'commentsDisabled', commentsOff));
    actions.appendChild(toggleCommentBtn);

    // Toggle reactions button
    const toggleReactBtn = document.createElement('button');
    toggleReactBtn.type = 'button';
    toggleReactBtn.className = 'msg-action-btn';
    toggleReactBtn.title = reactionsOff ? 'Enable reactions' : 'Disable reactions';
    toggleReactBtn.style.color = reactionsOff ? 'var(--error)' : 'var(--text-muted)';
    toggleReactBtn.innerHTML = reactionsOff
      ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4" y1="4" x2="20" y2="20" stroke-width="2.5"/></svg>`
      : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`;
    toggleReactBtn.addEventListener('click', () => toggleChannelFeature(msgId, chatId, 'reactionsDisabled', reactionsOff));
    actions.appendChild(toggleReactBtn);
  }

  bubbleWrap.appendChild(actions);
  row.appendChild(bubbleWrap);

  // Reactions display — hidden if reactionsDisabled
  if (!reactionsOff && msg.reactions && Object.keys(msg.reactions).length) {
    const reactionsBar = document.createElement('div');
    reactionsBar.className = 'reactions-bar';
    const counts = {};
    const myReactions = new Set();
    Object.entries(msg.reactions).forEach(([uid, emoji]) => {
      counts[emoji] = (counts[emoji] || 0) + 1;
      if (uid === currentUser.uid) myReactions.add(emoji);
    });
    Object.entries(counts).forEach(([emoji, count]) => {
      const pill = document.createElement('div');
      pill.className = 'reaction-pill' + (myReactions.has(emoji) ? ' mine' : '');
      pill.innerHTML = `${emoji}<span>${count}</span>`;
      pill.addEventListener('click', () => toggleReaction(msgId, chatId, isGroup, emoji));
      reactionsBar.appendChild(pill);
    });
    row.appendChild(reactionsBar);
  }

  // Disabled hints (only visible for non-admins in channel)
  if (isChannel && !isAdminCtx) {
    if (commentsOff || reactionsOff) {
      const hints = [];
      if (commentsOff) hints.push('Comments off');
      if (reactionsOff) hints.push('Reactions off');
      const hintEl = document.createElement('div');
      hintEl.className = 'channel-feature-disabled';
      hintEl.textContent = hints.join(' · ');
      row.appendChild(hintEl);
    }
  }

  const time = document.createElement('span');
  time.className = 'msg-time';

  // View count for channel posts
  if (isChannel && msgId) {
    const views = msg.views || [];
    const viewCount = views.length;
    // Track this user's view
    if (!views.includes(currentUser.uid)) {
      // Delayed to avoid excessive writes on initial load
      setTimeout(() => {
        db.collection('groups').doc(chatId).collection('messages').doc(msgId)
          .update({ views: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) })
          .catch(() => {});
      }, 500);
    }
    time.innerHTML = `${formatTime(msg.createdAt)}${msg.edited ? ' · edited' : ''} <span class="views-count"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${viewCount}</span>`;
  } else if (isSent && !isGroup && msgId) {
    // Private chat read receipt ticks
    const timeStr = formatTime(msg.createdAt);
    const edited = msg.edited ? ' · edited' : '';
    const msgTsMs = msg.createdAt && msg.createdAt.toMillis ? msg.createdAt.toMillis() : 0;
    const isSeen = partnerReadAt && msgTsMs && partnerReadAt.getTime() >= msgTsMs;
    const tick = document.createElement('span');
    tick.className = 'msg-tick ' + (isSeen ? 'seen' : 'delivered');
    tick.dataset.msgTs = msgTsMs;
    tick.innerHTML = isSeen ? seenSVG() : deliveredSVG();
    tick.title = isSeen ? 'Seen' : 'Delivered';
    time.textContent = timeStr + edited + ' ';
    time.appendChild(tick);
  } else {
    time.textContent = formatTime(msg.createdAt) + (msg.edited ? ' · edited' : '');
  }

  row.appendChild(time);
  messagesEl.appendChild(row);
}

/* ===== POLL WIDGET ===== */
function renderPollWidget(msg, msgId, chatId, isGroup) {
  const widget = document.createElement('div');
  widget.className = 'poll-widget';
  const title = document.createElement('div');
  title.className = 'poll-title';
  title.textContent = msg.pollQuestion || 'Poll';
  widget.appendChild(title);

  const totalVotes = Object.values(msg.pollVotes || {}).flat().length;
  const myVote = Object.entries(msg.pollVotes || {}).find(([, voters]) => (voters||[]).includes(currentUser.uid));

  (msg.pollOptions || []).forEach((opt, idx) => {
    const voters = (msg.pollVotes || {})[idx] || [];
    const count = voters.length;
    const pct = totalVotes ? Math.round(count / totalVotes * 100) : 0;

    const optEl = document.createElement('div');
    optEl.className = 'poll-option' + (myVote && parseInt(myVote[0]) === idx ? ' voted' : '');

    const bar = document.createElement('div');
    bar.className = 'poll-option-bar';
    bar.style.width = pct + '%';
    optEl.appendChild(bar);

    const textEl = document.createElement('div');
    textEl.className = 'poll-option-text';
    textEl.textContent = opt;
    optEl.appendChild(textEl);

    const pctEl = document.createElement('div');
    pctEl.className = 'poll-option-pct';
    pctEl.textContent = pct + '%';
    optEl.appendChild(pctEl);

    optEl.addEventListener('click', () => votePoll(msgId, chatId, isGroup, idx));
    widget.appendChild(optEl);
  });

  const total = document.createElement('div');
  total.className = 'poll-votes-total';
  total.textContent = `${totalVotes} vote${totalVotes !== 1 ? 's' : ''}`;
  widget.appendChild(total);

  return widget;
}

async function votePoll(msgId, chatId, isGroup, optionIdx) {
  const col = isGroup ? 'groups' : 'chats';
  const ref = db.collection(col).doc(chatId).collection('messages').doc(msgId);
  try {
    const snap = await ref.get();
    if (!snap.exists) return;
    const data = snap.data();
    const pollVotes = JSON.parse(JSON.stringify(data.pollVotes || {}));

    // Remove existing vote
    Object.keys(pollVotes).forEach(k => {
      pollVotes[k] = (pollVotes[k] || []).filter(uid => uid !== currentUser.uid);
    });
    // Add new vote
    if (!pollVotes[optionIdx]) pollVotes[optionIdx] = [];
    pollVotes[optionIdx].push(currentUser.uid);

    await ref.update({ pollVotes });
  } catch(err) {
    console.error('Vote error:', err);
  }
}

/* ===== REPLY ===== */
function startReply(msgId, msg) {
  replyToMsg = {
    id: msgId,
    text: msg.type === 'file' ? '📎 ' + (msg.fileName || 'File') : (msg.text || ''),
    senderUsername: msg.senderUsername || '',
    type: msg.type || 'text'
  };
  replyBarLabel.textContent = 'Reply to ' + (msg.senderUsername || '');
  replyBarText.textContent = replyToMsg.text;
  replyBar.classList.remove('hidden');
  messageInput.focus();
}

function clearReply() {
  replyToMsg = null;
  replyBar.classList.add('hidden');
}

replyCancelBtn.addEventListener('click', clearReply);

/* ===== PINNED MESSAGE ACTIONS ===== */
pinnedBarClose.addEventListener('click', async (e) => {
  e.stopPropagation();
  if (!activeChatId || !activeChatIsChannel || !activeChatIsAdmin) return;
  try {
    await db.collection('groups').doc(activeChatId).update({ pinnedMessageId: firebase.firestore.FieldValue.delete(), pinnedMessageText: firebase.firestore.FieldValue.delete() });
    showToast('Message unpinned');
  } catch(err) { console.error('Unpin error:', err); }
});

async function pinMessage(msgId, text) {
  if (!activeChatId || !activeChatIsChannel || !activeChatIsAdmin) return;
  try {
    const preview = (text || '').slice(0, 80);
    await db.collection('groups').doc(activeChatId).update({ pinnedMessageId: msgId, pinnedMessageText: preview });
    showToast('Message pinned');
  } catch(err) { console.error('Pin error:', err); }
}

async function toggleChannelFeature(msgId, chatId, field, currentVal) {
  try {
    await db.collection('groups').doc(chatId).collection('messages').doc(msgId).update({ [field]: !currentVal });
  } catch(err) { console.error('Toggle error:', err); }
}

/* ===== REACTIONS ===== */
const QUICK_REACTIONS = ['❤️','😂','👍','😮','😢','🙏','🔥','💯'];

function showReactionPicker(e, msgId, chatId, isGroup) {
  // Remove any existing picker
  document.querySelectorAll('.quick-reaction-picker').forEach(el => el.remove());

  const picker = document.createElement('div');
  picker.className = 'quick-reaction-picker';
  picker.style.cssText = `
    position:fixed;background:var(--surface);border:1px solid var(--border);
    border-radius:40px;padding:6px 10px;display:flex;gap:4px;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);z-index:300;
  `;
  QUICK_REACTIONS.forEach(emoji => {
    const btn = document.createElement('button');
    btn.style.cssText = 'background:transparent;border:none;cursor:pointer;font-size:20px;padding:4px;border-radius:8px;transition:transform 0.1s;';
    btn.textContent = emoji;
    btn.addEventListener('mouseenter', () => btn.style.transform = 'scale(1.3)');
    btn.addEventListener('mouseleave', () => btn.style.transform = 'scale(1)');
    btn.addEventListener('click', () => {
      toggleReaction(msgId, chatId, isGroup, emoji);
      picker.remove();
    });
    picker.appendChild(btn);
  });

  const rect = e.currentTarget.getBoundingClientRect();
  picker.style.top = (rect.top - 54) + 'px';
  picker.style.left = Math.max(8, rect.left - 80) + 'px';
  document.body.appendChild(picker);

  setTimeout(() => document.addEventListener('click', function handler() {
    picker.remove();
    document.removeEventListener('click', handler);
  }), 50);
}

async function toggleReaction(msgId, chatId, isGroup, emoji) {
  const col = isGroup ? 'groups' : 'chats';
  const ref = db.collection(col).doc(chatId).collection('messages').doc(msgId);
  try {
    const snap = await ref.get();
    if (!snap.exists) return;
    const reactions = { ...(snap.data().reactions || {}) };
    if (reactions[currentUser.uid] === emoji) {
      delete reactions[currentUser.uid];
    } else {
      reactions[currentUser.uid] = emoji;
    }
    await ref.update({ reactions });
  } catch(err) { console.error('Reaction error:', err); }
}

/* ===== EDIT MESSAGE ===== */
function startEditMessage(bubbleEl, msgId, chatId, isGroup, currentText) {
  let settled = false;
  // Remove children except group sender name and reply quote
  const children = Array.from(bubbleEl.children);
  const toKeep = children.filter(c => c.classList.contains('group-sender-name') || c.classList.contains('reply-quote'));
  const textSpan = bubbleEl.querySelector('span');
  if (textSpan) textSpan.remove();

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'msg-edit-input';
  input.value = currentText;
  bubbleEl.appendChild(input);
  input.focus();
  input.setSelectionRange(currentText.length, currentText.length);

  async function finish(save) {
    if (settled) return;
    settled = true;
    if (save) {
      const newText = input.value.trim();
      if (newText && newText !== currentText) {
        try {
          const col = isGroup ? 'groups' : 'chats';
          await db.collection(col).doc(chatId).collection('messages').doc(msgId)
            .update({ text: newText, edited: true });
          return;
        } catch(err) { alert('Failed to edit: ' + friendlyError(err)); }
      }
    }
    input.remove();
    const span = document.createElement('span');
    span.textContent = currentText;
    bubbleEl.appendChild(span);
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

/* ===== DELETE MESSAGE ===== */
async function deleteMessage(msgId, chatId, isGroup) {
  if (!confirm('Delete this message?')) return;
  try {
    const col = isGroup ? 'groups' : 'chats';
    await db.collection(col).doc(chatId).collection('messages').doc(msgId).delete();
    await refreshLastMessage(chatId, isGroup);
  } catch(err) { alert('Failed to delete: ' + friendlyError(err)); }
}

async function refreshLastMessage(chatId, isGroup) {
  try {
    const col = isGroup ? 'groups' : 'chats';
    const ref = db.collection(col).doc(chatId);
    const snap = await ref.collection('messages').orderBy('createdAt','desc').limit(1).get();
    if (snap.empty) {
      await ref.update({ lastMessage: '' });
    } else {
      const last = snap.docs[0].data();
      const preview = last.type === 'file' ? '📎 ' + (last.fileName || 'File') : (last.type === 'poll' ? '📊 Poll' : last.text);
      await ref.update({ lastMessage: preview, lastMessageAt: last.createdAt });
    }
  } catch(err) { console.error('refreshLastMessage error:', err); }
}

/* ===== SEND MESSAGE ===== */
function canPostInActiveChat() {
  if (!activeChatIsChannel) return true;
  const admins = (activeChatPartner && activeChatPartner.admins) || [];
  return admins.includes(currentUser.uid) || (activeChatPartner && activeChatPartner.createdBy === currentUser.uid);
}

/* ===== TYPING INDICATOR ===== */
function setTypingState(isTyping) {
  if (!activeChatId || isSavedMessagesView) return;
  const col = activeChatIsGroup ? 'groups' : 'chats';
  const ref = db.collection(col).doc(activeChatId);
  const updateData = { [`typing.${currentUser.uid}`]: isTyping ? firebase.firestore.FieldValue.serverTimestamp() : firebase.firestore.FieldValue.delete() };
  if (activeChatIsGroup && isTyping && currentUserData) {
    updateData[`typingNames.${currentUser.uid}`] = currentUserData.username;
  }
  ref.update(updateData).catch(()=>{});
}
messageInput.addEventListener('input', () => {
  if (!activeChatId || isSavedMessagesView) return;
  if (!isTypingFlag) { isTypingFlag = true; setTypingState(true); }
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => { isTypingFlag = false; setTypingState(false); }, 3000);
  if (!messageInput.value.trim() && isTypingFlag) {
    isTypingFlag = false; clearTimeout(typingTimeout); setTypingState(false);
  }
});
messageInput.addEventListener('blur', () => {
  if (isTypingFlag) { isTypingFlag = false; clearTimeout(typingTimeout); setTypingState(false); }
});

messageForm.addEventListener('submit', async e => {
  e.preventDefault();
  const text = messageInput.value.trim();
  if (!text || !activeChatId) return;
  if (activeChatIsChannel) {
    const admins = (activeChatPartner && activeChatPartner.admins) || [];
    const isAdminUser = admins.includes(currentUser.uid) || (activeChatPartner && activeChatPartner.createdBy === currentUser.uid);
    if (!isAdminUser) { showToast('Only admins can post in this channel'); return; }
  }
  messageInput.value = '';
  if (isTypingFlag) { isTypingFlag = false; clearTimeout(typingTimeout); setTypingState(false); }

  const col = activeChatIsGroup ? 'groups' : 'chats';
  const msgData = {
    text,
    senderId: currentUser.uid,
    senderUsername: currentUserData.username,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    type: 'text'
  };
  if (replyToMsg) {
    msgData.replyTo = { ...replyToMsg };
    clearReply();
  }

  try {
    const ref = db.collection(col).doc(activeChatId);
    await ref.collection('messages').add(msgData);
    const updateData = { lastMessage: text, lastMessageAt: firebase.firestore.FieldValue.serverTimestamp() };
    // Increment unread for recipients
    if (!activeChatIsGroup) {
      // Private chat: increment partner's unread
      const partnerUid = (activeChatPartner && activeChatPartner.uid) || null;
      if (partnerUid) updateData[`unreadCounts.${partnerUid}`] = firebase.firestore.FieldValue.increment(1);
    } else {
      // Group/channel: increment all members except sender
      const members = (activeChatPartner && activeChatPartner.members) || [];
      members.forEach(uid => {
        if (uid !== currentUser.uid) updateData[`unreadCounts.${uid}`] = firebase.firestore.FieldValue.increment(1);
      });
    }
    await ref.update(updateData);
  } catch(err) { alert('Failed to send: ' + friendlyError(err)); }
});

/* ===== IN-CHAT SEARCH ===== */
function closeChatSearch() {
  chatSearchBar.classList.add('hidden');
  chatSearchInput.value = '';
  chatSearchCount.textContent = '';
  currentChatMessages.forEach(m => m.el.classList.remove('search-match', 'search-match-active'));
  chatSearchMatches = [];
  chatSearchActiveIdx = -1;
}

function runChatSearch() {
  const term = chatSearchInput.value.trim().toLowerCase();
  currentChatMessages.forEach(m => m.el.classList.remove('search-match', 'search-match-active'));
  if (!term) { chatSearchMatches = []; chatSearchActiveIdx = -1; chatSearchCount.textContent = ''; return; }
  chatSearchMatches = currentChatMessages.filter(m => m.text && m.text.toLowerCase().includes(term));
  chatSearchMatches.forEach(m => m.el.classList.add('search-match'));
  if (chatSearchMatches.length) {
    chatSearchActiveIdx = chatSearchMatches.length - 1; // start from most recent match
    goToChatSearchMatch();
  } else {
    chatSearchActiveIdx = -1;
    chatSearchCount.textContent = '0/0';
  }
}

function goToChatSearchMatch() {
  chatSearchMatches.forEach(m => m.el.classList.remove('search-match-active'));
  if (chatSearchActiveIdx < 0 || !chatSearchMatches.length) return;
  const m = chatSearchMatches[chatSearchActiveIdx];
  m.el.classList.add('search-match-active');
  m.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  chatSearchCount.textContent = `${chatSearchActiveIdx + 1}/${chatSearchMatches.length}`;
}

chatSearchToggleBtn.addEventListener('click', () => {
  const isOpen = !chatSearchBar.classList.contains('hidden');
  if (isOpen) { closeChatSearch(); }
  else { chatSearchBar.classList.remove('hidden'); chatSearchInput.focus(); }
});
chatSearchCloseBtn.addEventListener('click', closeChatSearch);
chatSearchInput.addEventListener('input', runChatSearch);
chatSearchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); if (e.shiftKey) chatSearchPrevBtn.click(); else chatSearchNextBtn.click(); }
  if (e.key === 'Escape') closeChatSearch();
});
chatSearchNextBtn.addEventListener('click', () => {
  if (!chatSearchMatches.length) return;

/* ===== EMOJI PICKER ===== */
let currentEmojiCat = 0;

function buildEmojiPicker() {
  emojiPicker.innerHTML = '';
  const searchInp = document.createElement('input');
  searchInp.type = 'text';
  searchInp.placeholder = 'Search emoji…';
  searchInp.className = 'emoji-picker-search';
  emojiPicker.appendChild(searchInp);

  const cats = document.createElement('div');
  cats.className = 'emoji-picker-cats';
  EMOJI_CATS.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'emoji-cat-btn' + (i === currentEmojiCat ? ' active' : '');
    btn.title = cat.label;
    btn.textContent = cat.icon;
    btn.addEventListener('click', () => {
      currentEmojiCat = i;
      cats.querySelectorAll('.emoji-cat-btn').forEach((b,j) => b.classList.toggle('active', j===i));
      renderEmojiGrid(cat.emojis);
    });
    cats.appendChild(btn);
  });
  emojiPicker.appendChild(cats);

  const grid = document.createElement('div');
  grid.className = 'emoji-grid';
  grid.id = 'emoji-grid-inner';
  emojiPicker.appendChild(grid);

  function renderEmojiGrid(emojis) {
    grid.innerHTML = '';
    emojis.forEach(em => {
      const btn = document.createElement('button');
      btn.className = 'emoji-btn';
      btn.textContent = em;
      btn.addEventListener('click', () => {
        messageInput.value += em;
        messageInput.focus();
      });
      grid.appendChild(btn);
    });
  }

  renderEmojiGrid(EMOJI_CATS[currentEmojiCat].emojis);

  searchInp.addEventListener('input', () => {
    const term = searchInp.value.toLowerCase();
    if (!term) { renderEmojiGrid(EMOJI_CATS[currentEmojiCat].emojis); return; }
    const all = EMOJI_CATS.flatMap(c => c.emojis);
    renderEmojiGrid(all.filter(em => em.includes(term)));
  });
}

emojiBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOpen = !emojiPicker.classList.contains('hidden');
  closeAllPopups();
  if (!isOpen) {

    emojiPicker.classList.remove('hidden');
    emojiBtn.classList.add('active');

});

/* ===== FILE UPLOAD ===== */
fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file || !activeChatId) return;
  fileInput.value = '';
  if (!canPostInActiveChat()) { showToast('Only admins can post in this channel'); return; }

  if (file.size > 10 * 1024 * 1024) { alert('File must be under 10 MB'); return; }

  const col = activeChatIsGroup ? 'groups' : 'chats';
  const path = `files/${activeChatId}/${Date.now()}_${file.name}`;
  try {
    const snap = await storage.ref(path).put(file);
    const url = await snap.ref.getDownloadURL();

    const msgData = {
      type: 'file',
      fileName: file.name,
      fileSize: file.size,
      fileURL: url,
      senderId: currentUser.uid,
      senderUsername: currentUserData.username,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (replyToMsg) { msgData.replyTo = { ...replyToMsg }; clearReply(); }

    const ref = db.collection(col).doc(activeChatId);
    await ref.collection('messages').add(msgData);
    const fileUpdate = { lastMessage: '📎 ' + file.name, lastMessageAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (!activeChatIsGroup) {
      const pUid = activeChatPartner && activeChatPartner.uid;
      if (pUid) fileUpdate[`unreadCounts.${pUid}`] = firebase.firestore.FieldValue.increment(1);
    } else {
      const members = (activeChatPartner && activeChatPartner.members) || [];
      members.forEach(uid => { if (uid !== currentUser.uid) fileUpdate[`unreadCounts.${uid}`] = firebase.firestore.FieldValue.increment(1); });
    }
    await ref.update(fileUpdate);
  } catch(err) { alert('Failed to upload file: ' + friendlyError(err)); }
});

/* ===== POLL CREATOR ===== */
function buildPollCreator() {
  pollPanel.innerHTML = '';

  const title = document.createElement('h3');
  title.textContent = 'Create a Poll';
  pollPanel.appendChild(title);

  const qInput = document.createElement('input');
  qInput.placeholder = 'Question…';
  qInput.className = 'modal-input';
  qInput.style.marginBottom = '10px';
  pollPanel.appendChild(qInput);

  const optsList = document.createElement('div');
  optsList.className = 'poll-options-list';

  function addOptionRow(val) {
    const wrap = document.createElement('div');
    wrap.className = 'poll-option-input-wrap';
    const inp = document.createElement('input');
    inp.placeholder = 'Option…';
    inp.className = 'modal-input';
    inp.style.margin = '0';
    inp.value = val || '';
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'msg-action-btn danger';
    del.style.flexShrink = '0';
    del.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
    del.addEventListener('click', () => wrap.remove());
    wrap.appendChild(inp);
    wrap.appendChild(del);
    optsList.appendChild(wrap);
  }

  addOptionRow(); addOptionRow();
  pollPanel.appendChild(optsList);

  const addOptBtn = document.createElement('button');
  addOptBtn.type = 'button';
  addOptBtn.className = 'poll-add-option';
  addOptBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Option`;
  addOptBtn.addEventListener('click', () => addOptionRow());
  pollPanel.appendChild(addOptBtn);

  const actions = document.createElement('div');
  actions.className = 'poll-creator-actions';

  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button';
  cancelBtn.className = 'btn-sm ghost';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', () => pollPanel.classList.add('hidden'));

  const sendBtn = document.createElement('button');
  sendBtn.type = 'button';
  sendBtn.className = 'btn-sm primary';
  sendBtn.textContent = 'Send Poll';
  sendBtn.addEventListener('click', async () => {
    const question = qInput.value.trim();
    const options = Array.from(optsList.querySelectorAll('input')).map(i => i.value.trim()).filter(Boolean);
    if (!question) { alert('Enter a question'); return; }
    if (options.length < 2) { alert('Add at least 2 options'); return; }
    if (!canPostInActiveChat()) { showToast('Only admins can post in this channel'); return; }

    const col = activeChatIsGroup ? 'groups' : 'chats';
    const ref = db.collection(col).doc(activeChatId);
    await ref.collection('messages').add({
      type: 'poll',
      pollQuestion: question,
      pollOptions: options,
      pollVotes: {},
      senderId: currentUser.uid,
      senderUsername: currentUserData.username,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await ref.update({ lastMessage: '📊 ' + question, lastMessageAt: firebase.firestore.FieldValue.serverTimestamp() });
    pollPanel.classList.add('hidden');
  });

  actions.appendChild(cancelBtn);
  actions.appendChild(sendBtn);
  pollPanel.appendChild(actions);
}

async function showChannelSettings(channelId, channelData) {

  const isAdmin = admins.includes(currentUser.uid) || isOwner;

  const footer = modal.querySelector('.modal-footer');

  const avatarSec = document.createElement('div');
  avatarSec.className = 'modal-avatar-picker';

  const avPrev = document.createElement('div');
  avPrev.className = 'avatar-picker-img';

  if (isAdmin) {
    avPrev.style.cursor = 'pointer';
    avPrev.addEventListener('click', () => groupAvatarFileInput.click());
  }

  groupAvatarFileInput.onchange = async () => {

    const nameInp = document.createElement('input');

      const newName = nameInp.value.trim();

          const ref = storage.ref(`groups/${channelId}_avatar_${Date.now()}`);

          updates.photoURL = await ref.getDownloadURL();
          pendingGroupAvatarBlob = null;

        await db.collection('groups').doc(channelId).update(updates);
        chatWithUsername.textContent = newName;
        if (updates.photoURL) setAvatarContent(chatAvatar, newName, updates.photoURL);

    const row = document.createElement('div');

/* ===== AVATAR UPLOAD ===== */
avatarFileInput.addEventListener('change', async () => {
  const file = avatarFileInput.files[0];
  if (!file) return;
  avatarFileInput.value = '';

  if (!file.type.startsWith('image/')) { alert('Please select an image file'); return; }
  if (file.size > 5 * 1024 * 1024) { alert('Image must be under 5 MB'); return; }

  try {
    const ref = storage.ref(`avatars/${currentUser.uid}`);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    await db.collection('users').doc(currentUser.uid).update({ photoURL: url });
    currentUserData.photoURL = url;
    setAvatarContent(meAvatar, currentUserData.username, url);
    // Update any open modals
    document.querySelectorAll('.profile-avatar-big').forEach(el => {
      if (el.querySelector('img') || el.textContent === currentUserData.username.charAt(0).toUpperCase()) {
        setAvatarContent(el, currentUserData.username, url);
      }
    });
  } catch(err) { alert('Failed to upload photo: ' + friendlyError(err)); }
});

/* ===== MODAL HELPERS ===== */
function createModal(title) {
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'active-modal';
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  const modal = document.createElement('div');
  modal.className = 'modal';

  const header = document.createElement('div');
  header.className = 'modal-header';
  const titleEl = document.createElement('div');
  titleEl.className = 'modal-title';
  titleEl.textContent = title;
  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  closeBtn.addEventListener('click', closeModal);
  header.appendChild(titleEl);
  header.appendChild(closeBtn);

  const body = document.createElement('div');
  body.className = 'modal-body';
  const footer = document.createElement('div');
  footer.className = 'modal-footer';
  footer.style.flexDirection = 'column';

  modal.appendChild(header);
  modal.appendChild(body);
  modal.appendChild(footer);
  overlay.appendChild(modal);
  modalContainer.appendChild(overlay);
  return modal;
}


/* ===== CHAT CONTEXT MENU ===== */
let ctxMenuEl = null;

function closeChatCtxMenu() {
  if (ctxMenuEl) { ctxMenuEl.remove(); ctxMenuEl = null; }
}

document.addEventListener('click', e => {
  if (ctxMenuEl && !ctxMenuEl.contains(e.target)) closeChatCtxMenu();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeChatCtxMenu(); });

function showChatCtxMenu(e, chatId, type, item) {
  e.preventDefault();
  e.stopPropagation();
  closeChatCtxMenu();

  const isArchived = type === 'private'
    ? (item.chat.archivedBy && item.chat.archivedBy[currentUser.uid])
    : (item.group.archivedBy && item.group.archivedBy[currentUser.uid]);

  const isPinned = type === 'private'
    ? !!(item.chat.pinnedBy && item.chat.pinnedBy[currentUser.uid])
    : !!(item.group && item.group.pinnedBy && item.group.pinnedBy[currentUser.uid]);

  const menu = document.createElement('div');
  menu.className = 'chat-ctx-menu';
  menu.innerHTML = `
    <button class="chat-ctx-item" id="ctx-pin">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24z"/></svg>
      ${isPinned ? 'Unpin Chat' : 'Pin Chat'}
    </button>
    <button class="chat-ctx-item" id="ctx-archive">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
      ${isArchived ? 'Unarchive' : 'Archive'}
    </button>
    <div class="chat-ctx-divider"></div>
    <button class="chat-ctx-item danger" id="ctx-delete">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Delete Chat
    </button>
  `;

  // Position - append first to measure, then position
  menu.style.visibility = 'hidden';
  document.body.appendChild(menu);
  ctxMenuEl = menu;

  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  const mw = menu.offsetWidth || 190;
  const mh = menu.offsetHeight || 140;
  menu.style.left = Math.min(x, window.innerWidth - mw - 8) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - mh - 8) + 'px';
  menu.style.visibility = '';

  menu.querySelector('#ctx-pin').addEventListener('click', e => {
    e.stopPropagation();
    closeChatCtxMenu();
    togglePinChat(chatId, type, isPinned);
  });
  menu.querySelector('#ctx-archive').addEventListener('click', e => {
    e.stopPropagation();
    closeChatCtxMenu();
    toggleArchiveChat(chatId, type, isArchived);
  });
  menu.querySelector('#ctx-delete').addEventListener('click', e => {
    e.stopPropagation();
    closeChatCtxMenu();
    confirmDeleteChat(chatId, type, item);
  });
}

function addRowContextMenu(row, chatId, type, item) {
  // Desktop: right-click
  row.addEventListener('contextmenu', e => showChatCtxMenu(e, chatId, type, item));
  // Mobile: long press
  let pressTimer = null;
  row.addEventListener('touchstart', e => {
    pressTimer = setTimeout(() => { showChatCtxMenu(e, chatId, type, item); }, 500);
  }, { passive: true });
  row.addEventListener('touchend', () => clearTimeout(pressTimer));
  row.addEventListener('touchmove', () => clearTimeout(pressTimer));
}


async function togglePinChat(chatId, type, isPinned) {
  const col = type === 'private' ? 'chats' : 'groups';
  try {
    await db.collection(col).doc(chatId).update({ [`pinnedBy.${currentUser.uid}`]: !isPinned });
    showToast(isPinned ? 'Chat unpinned' : 'Chat pinned');
  } catch(err) {
    console.error(err);
    showToast('Error updating chat');
  }
}
async function toggleArchiveChat(chatId, type, isArchived) {
  const col = type === 'private' ? 'chats' : 'groups';
  const field = `archivedBy.${currentUser.uid}`;
  try {
    await db.collection(col).doc(chatId).update({ [field]: !isArchived });
    showToast(isArchived ? 'Chat unarchived' : 'Chat archived');
  } catch(err) {
    console.error(err);
    showToast('Error updating chat');
  }
}

function confirmDeleteChat(chatId, type, item) {
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'active-modal';
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  const name = type === 'private'
    ? (item.partner.displayName || item.partner.username || 'this user')
    : (item.group.name || 'this group');

  const box = document.createElement('div');
  box.className = 'modal';
  box.style.maxWidth = '340px';
  box.innerHTML = `
    <div class="modal-header">
      <span class="modal-title">Delete Chat</span>
    </div>
    <div style="padding:20px;color:var(--text-secondary);font-size:14px;line-height:1.5;">
      Delete your chat with <strong style="color:var(--text-primary);">${name}</strong>?<br>
      <span style="color:var(--text-muted);font-size:12.5px;">This only removes it from your view. The other person won't be affected.</span>
    </div>
    <div style="display:flex;gap:10px;padding:0 20px 20px;">
      <button id="del-cancel" style="flex:1;padding:11px;border:1px solid var(--border);background:transparent;color:var(--text-primary);border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;">Cancel</button>
      <button id="del-confirm" style="flex:1;padding:11px;border:none;background:#ef4444;color:#fff;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;">Delete</button>
    </div>
  `;
  overlay.appendChild(box);
  document.getElementById('modal-container').appendChild(overlay);

  box.querySelector('#del-cancel').addEventListener('click', closeModal);
  box.querySelector('#del-confirm').addEventListener('click', async () => {
    closeModal();
    await doDeleteChat(chatId, type);
  });
}

async function doDeleteChat(chatId, type) {
  try {
    if (type === 'private') {
      // Mark as deleted for this user only
      await db.collection('chats').doc(chatId).update({
        [`deletedBy.${currentUser.uid}`]: true,
        [`archivedBy.${currentUser.uid}`]: firebase.firestore.FieldValue.delete()
      });
    } else {
      // Leave group
      await db.collection('groups').doc(chatId).update({
        members: firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
      });
    }
    if (activeChatId === chatId) {
      chatActive.classList.add('hidden');
      chatEmpty.classList.remove('hidden');
      activeChatId = null;
      if (unsubMessages) { unsubMessages(); unsubMessages = null; }
      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.remove('hide-mobile');
        var nav = document.getElementById('mobile-nav');
        if (nav) nav.style.display = '';
      }
    }
    showToast(type === 'private' ? 'Chat deleted' : 'Left group');
  } catch(err) {
    console.error(err);
    showToast('Error deleting chat');
  }
}

function toggleArchiveSection() {
  const list = document.getElementById('archived-list');
  const toggle = document.getElementById('archive-toggle-row');
  const isOpen = list.style.display !== 'none';
  list.style.display = isOpen ? 'none' : 'block';
  toggle.classList.toggle('open', !isOpen);
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(30,30,46,0.95);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:1000;pointer-events:none;animation:popIn 0.2s ease;';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function closeModal() {
  const existing = document.getElementById('active-modal');
  if (existing) existing.remove();
  pendingGroupAvatarBlob = null;
}


/* ===== MOBILE NAV ===== */
function mobileNavSwitch(tab) {
  document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.remove('active'));
  const activeBtn = document.getElementById('mnav-' + tab);
  if (activeBtn) activeBtn.classList.add('active');
  const sidebar = document.getElementById('sidebar');

  if (tab === 'chats') {
    if (window.innerWidth <= 768) sidebar.classList.remove('hide-mobile');
  } else if (tab === 'search') {
    if (window.innerWidth <= 768) {
      sidebar.classList.remove('hide-mobile');
      setTimeout(() => {
        const s = document.getElementById('user-search');
        if (s) { s.focus(); s.select(); }
      }, 100);
    }
  } else if (tab === 'profile') {
    const profileBtn = document.getElementById('me-profile-btn');
    if (profileBtn) profileBtn.click();
    setTimeout(() => {
      document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.remove('active'));
      if (activeBtn) activeBtn.classList.add('active');
    }, 50);
  } else if (tab === 'settings') {
    showMobileSettings();
    setTimeout(() => {
      document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.remove('active'));
      const chatsBtn = document.getElementById('mnav-chats');
      if (chatsBtn) chatsBtn.classList.add('active');
    }, 200);
  }
}

/* ===== SAFARI iOS KEYBOARD FIX ===== */
(function() {
  var isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) || 
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function applyViewportHeight() {
    var vp = window.visualViewport;
    var vh = vp ? vp.height : window.innerHeight;
    
    document.documentElement.style.setProperty('--app-height', vh + 'px');
    
    // On iOS, when keyboard opens, visualViewport shifts up (offsetTop increases).
    // We need to counteract this by translating the app down by the offset amount.
    if (isIOS && vp) {
      var offsetTop = vp.offsetTop || 0;
      var app = document.getElementById('app');
      var auth = document.getElementById('auth-screen');
      
      if (app && !app.classList.contains('hidden')) {
        app.style.height = vh + 'px';
        app.style.transform = 'translateY(' + offsetTop + 'px)';
      }
      if (auth && !auth.classList.contains('hidden')) {
        auth.style.height = vh + 'px';
      }
    }
  }

  applyViewportHeight();

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', applyViewportHeight);
    window.visualViewport.addEventListener('scroll', applyViewportHeight);
  }
  window.addEventListener('resize', applyViewportHeight);
  window.addEventListener('orientationchange', function() {
    setTimeout(applyViewportHeight, 300);
  });
})();




const CACHE_NAME = 'mymessenger-v1';
const BASE = '/Massenger/';
const STATIC_ASSETS = [
  BASE,
  BASE + 'index.html',
  BASE + 'manifest.json',
  BASE + '1.png',
  'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap'
];

// Install: cache static assets
self.addEventListener('install', event => {
  event.waitUntil(
    caches.open(CACHE_NAME).then(cache => {
      return cache.addAll(STATIC_ASSETS).catch(err => {
        console.warn('Some assets could not be cached:', err);
      });
    })
  );
  self.skipWaiting();
});

// Activate: clean up old caches
self.addEventListener('activate', event => {
  event.waitUntil(
    caches.keys().then(keys =>
      Promise.all(
        keys.filter(key => key !== CACHE_NAME).map(key => caches.delete(key))
      )
    )
  );
  self.clients.claim();
});

// Fetch: network-first for Firebase, cache-first for static
self.addEventListener('fetch', event => {
  const url = new URL(event.request.url);

  // Skip non-GET and Firebase/API requests (always use network)
  if (
    event.request.method !== 'GET' ||
    url.hostname.includes('firestore.googleapis.com') ||
    url.hostname.includes('firebase') ||
    url.hostname.includes('googleapis.com') ||
    url.hostname.includes('gstatic.com')
  ) {
    return; // Let the browser handle it
  }

  // Cache-first for static assets
  event.respondWith(
    caches.match(event.request).then(cached => {
      if (cached) return cached;
      return fetch(event.request).then(response => {
        if (!response || response.status !== 200 || response.type === 'opaque') {
          return response;
        }
        const clone = response.clone();
        caches.open(CACHE_NAME).then(cache => cache.put(event.request, clone));
        return response;
      }).catch(() => {
        // Offline fallback for navigation
        if (event.request.mode === 'navigate') {
          return caches.match(BASE + 'index.html');
        }
      });
    })
  );
});

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Avenix Messenger - Beta</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyMessenger">
<link rel="apple-touch-icon" href="1.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
:root{
  --primary:#2563EB;--primary-dark:#1d4ed8;--primary-light:#60a5fa;
  --bg:#0a0a0f;--sidebar-bg:#0f0f17;--sidebar-header-bg:#13131e;
  --chat-bg:#08080f;--chat-header-bg:#0f0f17;
  --bubble-sent:#1e3a5f;--bubble-received:#13131e;
  --input-bg:#13131e;--input-border:#1e1e2e;
  --text-primary:#e8eaf0;--text-secondary:#8b92a8;--text-muted:#545870;
  --border:#1a1a28;--online:#22c55e;
  --row-hover:#131320;--row-active:#1a2744;
  --scrollbar:#1e1e2e;--accent:#2563EB;
  --error:#ef4444;--glass-bg:rgba(13,13,22,0.92);
  --surface:#13131e;--surface2:#1a1a28;
  --blue-glow:rgba(37,99,235,0.15);
  --gray:#1e1e2e;--white:#e8eaf0;
  --app-height:100vh;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{
  height:100%;width:100%;
  background:var(--bg);color:var(--text-primary);
  overflow:hidden;overscroll-behavior:none;
}
/* Safari iOS dvh support */
@supports (height: 100dvh) {
  html, body { height: 100dvh; }
}
.hidden{display:none!important;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#2a2a3e;}

/* ===== AUTH ===== */
.auth-screen{
  height:var(--app-height,100vh);width:100%;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 120% 80% at 50% 0%,#0d1424 0%,#08080f 60%);
  padding:16px;position:relative;overflow:hidden;
}
.auth-screen::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(37,99,235,0.06) 0%,transparent 70%);
  pointer-events:none;
}
.auth-card{
  background:var(--glass-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  width:100%;max-width:420px;border-radius:24px;
  padding:44px 40px;
  box-shadow:0 32px 80px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.05);
  animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  position:relative;z-index:1;
}
@keyframes popIn{from{opacity:0;transform:translateY(24px) scale(0.95);}to{opacity:1;transform:none;}}

.brand{
  text-align:center;margin-bottom:36px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.brand-logo-img{
  width:72px;height:72px;border-radius:20px;
  background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  border:2px dashed var(--border);
  color:var(--text-muted);font-size:11px;text-align:center;padding:6px;
}
.brand-logo-img img{width:100%;height:100%;object-fit:cover;border-radius:16px;}

.auth-tabs{
  display:flex;margin-bottom:28px;border-radius:14px;
  background:rgba(13,13,22,0.8);padding:4px;gap:4px;
  border:1px solid var(--border);
}
.auth-tab{
  flex:1;padding:10px 16px;border:none;background:transparent;
  border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;
  color:var(--text-muted);transition:all 0.2s ease;
}
.auth-tab.active{
  background:var(--primary);color:#fff;
  box-shadow:0 4px 16px rgba(37,99,235,0.4);
}
.auth-tab:not(.active):hover{color:var(--text-secondary);background:rgba(255,255,255,0.04);}

.auth-form{display:flex;flex-direction:column;gap:14px;}
.input-group{position:relative;}
.input-group label{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:14px;color:var(--text-muted);pointer-events:none;
  transition:all 0.2s ease;background:transparent;padding:0 4px;z-index:1;
}
.input-group input:focus ~ label,
.input-group input:not(:placeholder-shown) ~ label{
  top:0;font-size:11px;color:var(--primary);
  background:linear-gradient(to bottom,transparent 40%,var(--glass-bg) 40%);
}
.input-group input{
  width:100%;padding:14px 16px;
  border:1.5px solid var(--input-border);border-radius:12px;
  font-size:16px;outline:none;transition:all 0.2s ease;
  background:rgba(13,13,22,0.6);color:var(--text-primary);
}
.input-group input::placeholder{color:transparent;}
.input-group input:focus{border-color:var(--primary);background:rgba(13,13,22,0.9);box-shadow:0 0 0 3px rgba(37,99,235,0.12);}
.pw-group{position:relative;}
.pw-group input{padding-right:48px;}
.pw-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:transparent;border:none;cursor:pointer;color:var(--text-muted);
  padding:4px;display:flex;align-items:center;transition:color 0.2s;
}
.pw-toggle:hover{color:var(--text-secondary);}
.btn-primary{
  padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  transition:all 0.2s ease;
  box-shadow:0 6px 20px rgba(37,99,235,0.35);
  margin-top:4px;position:relative;overflow:hidden;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(37,99,235,0.45);}
.btn-primary:active{transform:translateY(0);}
.auth-error{color:var(--error);font-size:12.5px;min-height:16px;text-align:center;}

/* ===== APP LAYOUT ===== */
.app{display:flex;height:var(--app-height,100vh);width:100%;background:var(--bg);overflow:hidden;}

/* ===== SIDEBAR ===== */
.sidebar{
  width:340px;min-width:260px;background:var(--sidebar-bg);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;
  transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);
}
.sidebar-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:var(--sidebar-header-bg);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.me{display:flex;align-items:center;gap:10px;overflow:hidden;flex:1;min-width:0;cursor:pointer;}
.me:hover .me-username{color:var(--primary);}
.avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary-dark),var(--primary-light));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;flex-shrink:0;text-transform:uppercase;
  box-shadow:0 2px 10px rgba(37,99,235,0.3);
  overflow:hidden;position:relative;
}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.avatar.sm{width:34px;height:34px;font-size:13px;}
.avatar.md{width:48px;height:48px;font-size:18px;}
.avatar.lg{width:64px;height:64px;font-size:24px;}
.me-info{display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.me-username{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-primary);transition:color 0.2s;}
.me-status{font-size:11px;color:var(--online);display:flex;align-items:center;gap:4px;}

.sidebar-actions{display:flex;align-items:center;gap:2px;}
.icon-btn{
  border:none;background:transparent;cursor:pointer;
  color:var(--text-muted);padding:7px;border-radius:10px;
  transition:all 0.2s;flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:var(--surface2);color:var(--text-secondary);}
.icon-btn.danger:hover{background:rgba(239,68,68,0.12);color:var(--error);}
.icon-btn.active{color:var(--primary);background:rgba(37,99,235,0.12);}

.sidebar-tabs{
  display:flex;background:var(--sidebar-header-bg);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.sidebar-tab{
  flex:1;padding:10px;border:none;background:transparent;
  cursor:pointer;font-size:12px;font-weight:600;color:var(--text-muted);
  transition:all 0.2s;border-bottom:2px solid transparent;
}
.sidebar-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.sidebar-tab:hover:not(.active){color:var(--text-secondary);}

.search-box{
  padding:10px 12px;background:var(--sidebar-header-bg);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.search-wrap{position:relative;}
.search-icon{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);pointer-events:none;display:flex;
}
.search-wrap input{
  width:100%;padding:8px 14px 8px 34px;border-radius:20px;
  border:1.5px solid transparent;background:var(--surface);
  outline:none;font-size:16px;color:var(--text-primary);
  transition:all 0.2s;
}
.search-wrap input::placeholder{color:var(--text-muted);}
.search-wrap input:focus{border-color:var(--primary);background:var(--surface2);}

.chats-list-label{
  padding:10px 14px 4px;font-size:10.5px;font-weight:700;
  color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;flex-shrink:0;
}
.chats-list,.search-results{overflow-y:auto;flex:1;}
.search-results{flex:none;max-height:50%;}

/* ===== FOLDER TABS ===== */
.folder-tabs{
  display:flex;align-items:center;gap:6px;padding:8px 10px;
  background:var(--sidebar-bg);border-bottom:1px solid var(--border);
  overflow-x:auto;flex-shrink:0;scrollbar-width:none;
}
.folder-tabs::-webkit-scrollbar{display:none;}
.folder-tab{
  flex-shrink:0;padding:6px 13px;border-radius:16px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-secondary);font-size:12.5px;font-weight:600;
  cursor:pointer;transition:all 0.18s ease;white-space:nowrap;user-select:none;
}
.folder-tab:hover{background:var(--surface2);color:var(--text-primary);}
.folder-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.folder-tab-add{
  flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px dashed var(--border);
  background:transparent;color:var(--text-muted);cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:all 0.18s ease;
}
.folder-tab-add:hover{color:var(--primary);border-color:var(--primary);}

/* ===== CHANNEL ===== */
.channel-badge{
  font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:6px;
  background:rgba(168,85,247,0.16);color:#c084fc;text-transform:uppercase;letter-spacing:0.4px;margin-left:4px;
}
.channel-locked-bar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px;color:var(--text-muted);font-size:13px;font-weight:600;
  background:var(--input-bg);border-top:1px solid var(--input-border);flex-shrink:0;
}
.member-role-badge.owner-badge{background:rgba(168,85,247,0.16);color:#c084fc;}
.folder-pick-row{
  display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer;
}
.folder-pick-row input{width:17px;height:17px;accent-color:var(--primary);cursor:pointer;}

/* ===== USER ROW ===== */
.user-row{
  display:flex;align-items:center;gap:11px;padding:8px 12px;
  cursor:pointer;transition:background 0.15s;
}
.user-row:hover{background:var(--row-hover);}
.user-row.active{background:var(--row-active);}
.user-row-body{flex:1;min-width:0;border-bottom:1px solid var(--border);padding-bottom:8px;}
.user-row:last-child .user-row-body{border-bottom:none;}
.user-row-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.user-row-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-primary);flex:1;min-width:0;}
.user-row-time{font-size:11px;color:var(--text-muted);flex-shrink:0;margin-left:6px;}
.user-row-sub{font-size:12.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.group-badge{
  background:rgba(37,99,235,0.15);color:var(--primary-light);
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;
  border:1px solid rgba(37,99,235,0.2);margin-left:6px;flex-shrink:0;
}
.avatar-wrap{position:relative;flex-shrink:0;}
.status-dot{
  width:10px;height:10px;border-radius:50%;
  background:#2a2a3e;border:2px solid var(--sidebar-bg);
  position:absolute;right:0;bottom:0;transition:background 0.3s;
}
.status-dot.online{background:var(--online);}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:32px 16px;color:var(--text-muted);
}
.empty-state svg{opacity:0.25;}
.empty-state p{font-size:13px;text-align:center;opacity:0.7;}

/* ===== CHAT WINDOW ===== */
.chat-window{flex:1;display:flex;flex-direction:column;background:var(--chat-bg);position:relative;min-width:0;}
.chat-window::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(37,99,235,0.018) 1px,transparent 1px);
  background-size:30px 30px;pointer-events:none;z-index:0;
}
.chat-empty{
  flex:1;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;color:var(--text-muted);
  position:relative;z-index:1;
}
.chat-empty svg{opacity:0.18;}
.chat-empty p{font-size:15px;opacity:0.55;}
.chat-active{display:flex;flex-direction:column;height:100%;position:relative;z-index:1;overflow:hidden;}

.chat-header{
  display:flex;align-items:center;gap:12px;
  padding:11px 16px;background:var(--chat-header-bg);
  border-bottom:1px solid var(--border);flex-shrink:0;
  box-shadow:0 1px 8px rgba(0,0,0,0.3);
}
.chat-header-info{flex:1;display:flex;flex-direction:column;min-width:0;cursor:pointer;}
.chat-header-info:hover .chat-with-username{color:var(--primary);}
.chat-with-username{font-weight:700;font-size:15px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 0.2s;}
.chat-with-status{font-size:11.5px;color:var(--text-muted);transition:color 0.3s;}
.chat-with-status.online{color:var(--online);}
.chat-with-status.typing{color:var(--primary);}
.chat-member-count{font-size:11.5px;color:var(--text-muted);}

/* ===== TYPING INDICATOR (chat list preview) ===== */
.typing-dots{display:inline-flex;align-items:center;gap:2px;vertical-align:middle;}
.typing-dots span{width:4px;height:4px;border-radius:50%;background:var(--primary);animation:typingBlink 1.2s infinite ease-in-out;}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes typingBlink{0%,80%,100%{opacity:0.25;transform:scale(0.8);}40%{opacity:1;transform:scale(1);}}

/* ===== IN-CHAT SEARCH BAR ===== */
.chat-search-bar{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;background:var(--chat-header-bg);
  border-bottom:1px solid var(--border);flex-shrink:0;
  animation:slideUp 0.15s ease;
}
.chat-search-bar input{
  flex:1;border:none;outline:none;background:var(--input-bg);
  color:var(--text-primary);padding:8px 12px;border-radius:10px;font-size:13.5px;
  border:1px solid var(--input-border);
}
.chat-search-bar input:focus{border-color:var(--primary);}
.chat-search-count{font-size:11.5px;color:var(--text-muted);white-space:nowrap;min-width:34px;text-align:center;}
.chat-search-nav-btn{
  background:transparent;border:none;cursor:pointer;color:var(--text-secondary);
  padding:6px;border-radius:8px;display:flex;transition:all 0.15s;
}
.chat-search-nav-btn:hover{background:var(--row-hover);color:var(--text-primary);}
.chat-search-nav-btn:disabled{opacity:0.3;cursor:default;}
.chat-search-close{
  background:transparent;border:none;cursor:pointer;color:var(--text-muted);
  padding:6px;border-radius:8px;display:flex;transition:color 0.2s;
}
.chat-search-close:hover{color:var(--error);}
.bubble.search-match{box-shadow:0 0 0 2px var(--primary-light);}
.bubble.search-match-active{box-shadow:0 0 0 2px var(--primary),0 0 16px rgba(37,99,235,0.5);}

/* ===== SAVED MESSAGES ===== */
.saved-row .avatar{background:linear-gradient(135deg,#f59e0b,#d97706)!important;}
.saved-source-tag{font-size:11px;color:var(--text-muted);margin-bottom:2px;font-weight:600;}

/* ===== REPLY BAR ===== */
.reply-bar{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;background:var(--chat-header-bg);
  border-top:2px solid var(--primary);flex-shrink:0;
  animation:slideUp 0.15s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.reply-bar-content{flex:1;min-width:0;}
.reply-bar-label{font-size:11px;font-weight:700;color:var(--primary);margin-bottom:2px;}
.reply-bar-text{font-size:12.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reply-bar-close{
  background:transparent;border:none;cursor:pointer;
  color:var(--text-muted);padding:4px;border-radius:6px;
  display:flex;transition:color 0.2s;
}
.reply-bar-close:hover{color:var(--error);}

/* ===== MESSAGES ===== */
.messages{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth;}
.date-separator{display:flex;align-items:center;justify-content:center;margin:12px 0 8px;}
.date-separator span{
  background:rgba(37,99,235,0.1);color:var(--text-secondary);
  font-size:11.5px;padding:3px 12px;border-radius:10px;
  border:1px solid rgba(37,99,235,0.06);font-weight:500;
}

.message-row{display:flex;flex-direction:column;max-width:64%;animation:msgIn 0.2s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.message-row.sent{align-self:flex-end;align-items:flex-end;}
.message-row.received{align-self:flex-start;align-items:flex-start;}
.message-row.sent+.message-row.sent,.message-row.received+.message-row.received{margin-top:-2px;}

/* Reply quote inside bubble */
.reply-quote{
  background:rgba(255,255,255,0.06);border-left:3px solid var(--primary);
  border-radius:8px;padding:5px 10px;margin-bottom:5px;cursor:pointer;
}
.reply-quote-name{font-size:11px;font-weight:700;color:var(--primary-light);margin-bottom:2px;}
.reply-quote-text{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;}

/* File attachment */
.file-attachment{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;cursor:pointer;margin-bottom:4px;
  transition:background 0.15s;
}
.file-attachment:hover{background:rgba(255,255,255,0.08);}
.file-attachment-icon{
  width:36px;height:36px;border-radius:8px;
  background:rgba(37,99,235,0.2);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:var(--primary-light);
}
.file-attachment-info{flex:1;min-width:0;}
.file-attachment-name{font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-attachment-size{font-size:11px;color:var(--text-muted);}

/* Poll */
.poll-widget{padding:8px 0;min-width:200px;}
.poll-title{font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:8px;}
.poll-option{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border:1.5px solid var(--border);border-radius:10px;
  cursor:pointer;margin-bottom:5px;background:rgba(255,255,255,0.03);
  transition:all 0.15s;position:relative;overflow:hidden;
}
.poll-option:hover{border-color:var(--primary);background:rgba(37,99,235,0.06);}
.poll-option.voted{border-color:var(--primary);background:rgba(37,99,235,0.12);}
.poll-option-bar{
  position:absolute;left:0;top:0;bottom:0;
  background:rgba(37,99,235,0.08);transition:width 0.4s ease;
  pointer-events:none;
}
.poll-option-text{font-size:13px;color:var(--text-primary);flex:1;position:relative;}
.poll-option-pct{font-size:12px;font-weight:700;color:var(--primary-light);position:relative;}
.poll-votes-total{font-size:11px;color:var(--text-muted);margin-top:4px;text-align:right;}

.bubble{
  padding:9px 13px;border-radius:16px;
  font-size:14.5px;line-height:1.55;
  word-wrap:break-word;word-break:break-word;max-width:100%;
}
.message-row.sent .bubble{background:var(--bubble-sent);color:#ddeeff;border-bottom-right-radius:4px;}
.message-row.received .bubble{background:var(--bubble-received);color:var(--text-primary);border-bottom-left-radius:4px;}
.group-sender-name{font-size:11.5px;font-weight:700;color:var(--primary-light);margin-bottom:3px;}

.msg-time{font-size:10.5px;color:var(--text-muted);margin-top:2px;padding:0 3px;display:flex;align-items:center;gap:4px;}
.message-row.sent .msg-time{color:#4a7a9b;}

/* Reactions */
.reactions-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;}
.reaction-pill{
  display:flex;align-items:center;gap:3px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;padding:2px 7px;cursor:pointer;font-size:13px;
  transition:all 0.15s;
}
.reaction-pill:hover{background:rgba(37,99,235,0.15);border-color:var(--primary);}
.reaction-pill.mine{background:rgba(37,99,235,0.18);border-color:var(--primary);}
.reaction-pill span{font-size:11px;color:var(--text-muted);}

.bubble-wrap{display:flex;align-items:center;gap:5px;max-width:100%;}
.message-row.sent .bubble-wrap{flex-direction:row-reverse;}
.msg-actions{display:flex;gap:2px;opacity:0;transition:opacity 0.15s;flex-shrink:0;}
.message-row:hover .msg-actions,.msg-actions:focus-within{opacity:1;}
.msg-action-btn{
  background:transparent;border:none;cursor:pointer;color:var(--text-muted);
  padding:4px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;
}
.msg-action-btn:hover{color:var(--primary);background:rgba(37,99,235,0.12);}
.msg-action-btn.danger:hover{color:var(--error);background:rgba(239,68,68,0.12);}
.msg-edit-input{
  background:rgba(0,0,0,0.3);border:1.5px solid var(--primary);border-radius:12px;
  padding:8px 13px;font-size:14.5px;color:inherit;outline:none;min-width:140px;font-family:inherit;
}
@media(hover:none){.msg-actions{opacity:0.6;}}

/* ===== EMOJI PICKER ===== */
.emoji-picker{
  position:absolute;bottom:70px;right:14px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:12px;
  box-shadow:0 12px 40px rgba(0,0,0,0.6);z-index:100;
  width:320px;animation:popIn 0.2s ease;
}
.emoji-picker-search{
  width:100%;padding:8px 12px;border-radius:10px;
  border:1.5px solid var(--border);background:var(--surface2);
  color:var(--text-primary);font-size:13px;outline:none;margin-bottom:10px;
}
.emoji-picker-search:focus{border-color:var(--primary);}
.emoji-picker-cats{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;}
.emoji-cat-btn{
  background:transparent;border:none;cursor:pointer;
  padding:5px 8px;border-radius:8px;font-size:16px;transition:background 0.15s;flex-shrink:0;
}
.emoji-cat-btn.active,.emoji-cat-btn:hover{background:var(--surface2);}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:200px;overflow-y:auto;}
.emoji-btn{
  background:transparent;border:none;cursor:pointer;
  font-size:20px;padding:5px;border-radius:8px;transition:background 0.1s;
  display:flex;align-items:center;justify-content:center;
}
.emoji-btn:hover{background:var(--surface2);}

/* ===== FILE PICKER ===== */
.attach-menu{
  position:absolute;bottom:70px;left:14px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:8px;
  box-shadow:0 10px 36px rgba(0,0,0,0.5);z-index:100;
  animation:popIn 0.2s ease;min-width:180px;
}
.attach-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;border-radius:10px;cursor:pointer;
  transition:background 0.15s;color:var(--text-secondary);font-size:14px;
}
.attach-item:hover{background:var(--surface2);color:var(--text-primary);}
.attach-item-icon{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;
}

/* ===== POLL CREATOR ===== */
.poll-creator{
  position:absolute;bottom:70px;left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:20px;
  box-shadow:0 12px 40px rgba(0,0,0,0.6);z-index:100;
  width:340px;animation:popIn 0.2s ease;
}
.poll-creator h3{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--text-primary);}
.poll-creator input{
  width:100%;padding:9px 13px;border-radius:10px;
  border:1.5px solid var(--border);background:var(--surface2);
  color:var(--text-primary);font-size:16px;outline:none;margin-bottom:8px;
}
.poll-creator input:focus{border-color:var(--primary);}
.poll-options-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.poll-option-input-wrap{display:flex;align-items:center;gap:6px;}
.poll-option-input-wrap input{margin-bottom:0;}
.poll-add-option{
  background:transparent;border:none;cursor:pointer;
  color:var(--primary);font-size:13px;font-weight:600;padding:4px 0;
  display:flex;align-items:center;gap:5px;
}
.poll-creator-actions{display:flex;gap:8px;margin-top:14px;}
.btn-sm{padding:8px 16px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.btn-sm.primary{background:var(--primary);color:#fff;}
.btn-sm.primary:hover{background:var(--primary-dark);}
.btn-sm.ghost{background:var(--surface2);color:var(--text-secondary);}
.btn-sm.ghost:hover{color:var(--text-primary);}

/* ===== MESSAGE FORM ===== */
.message-form{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;background:var(--chat-header-bg);
  border-top:1px solid var(--border);flex-shrink:0;
  padding-bottom:max(10px, env(safe-area-inset-bottom));
}
.msg-input-wrap{flex:1;position:relative;}
.message-form input{
  width:100%;padding:10px 14px;border-radius:22px;
  border:1.5px solid var(--input-border);
  background:var(--input-bg);outline:none;
  font-size:16px;color:var(--text-primary);transition:all 0.2s;
}
.message-form input::placeholder{color:var(--text-muted);}
.message-form input:focus{border-color:var(--primary);background:var(--surface2);}
.btn-send{
  width:42px;height:42px;border-radius:50%;border:none;
  background:var(--primary);color:#fff;cursor:pointer;
  flex-shrink:0;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(37,99,235,0.35);
}
.btn-send:hover{background:var(--primary-dark);transform:scale(1.07);}
.btn-send:active{transform:scale(0.93);}
.form-icon-btn{
  width:38px;height:38px;border:none;background:transparent;
  cursor:pointer;color:var(--text-muted);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;
}
.form-icon-btn:hover{background:var(--surface2);color:var(--text-secondary);}
.form-icon-btn.active{color:var(--primary);background:rgba(37,99,235,0.12);}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  display:flex;align-items:center;justify-content:center;
  z-index:200;padding:16px;backdrop-filter:blur(4px);
  animation:fadeIn 0.15s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;width:100%;max-width:400px;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
  animation:popIn 0.2s ease;overflow:hidden;
  max-height:90vh;display:flex;flex-direction:column;
}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-title{font-size:16px;font-weight:700;color:var(--text-primary);}
.modal-close{
  background:transparent;border:none;cursor:pointer;
  color:var(--text-muted);padding:5px;border-radius:8px;
  display:flex;transition:color 0.2s;
}
.modal-close:hover{color:var(--error);}
.modal-body{padding:20px;overflow-y:auto;}
.modal-footer{
  display:flex;gap:10px;padding:16px 20px;
  border-top:1px solid var(--border);flex-shrink:0;
}
.modal-input{
  width:100%;padding:10px 14px;border-radius:11px;
  border:1.5px solid var(--border);background:var(--surface2);
  color:var(--text-primary);font-size:16px;outline:none;margin-bottom:12px;
}
.modal-input:focus{border-color:var(--primary);}
.modal-label{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:6px;display:block;}
.modal-section{margin-bottom:16px;}
.modal-avatar-picker{
  display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px;
}
.avatar-picker-img{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary-dark),var(--primary-light));
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:700;color:#fff;overflow:hidden;position:relative;cursor:pointer;
}
.avatar-picker-img img{width:100%;height:100%;object-fit:cover;}
.avatar-picker-img:hover::after{
  content:'Edit';position:absolute;inset:0;background:rgba(0,0,0,0.5);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;border-radius:50%;
}
.btn-full{width:100%;padding:11px;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;margin-bottom:8px;}
.btn-danger{background:rgba(239,68,68,0.15);color:var(--error);border:1px solid rgba(239,68,68,0.2);}
.btn-danger:hover{background:rgba(239,68,68,0.25);}
.btn-blue{background:var(--primary);color:#fff;}
.btn-blue:hover{background:var(--primary-dark);}
.member-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.member-row:last-child{border-bottom:none;}
.member-row-info{flex:1;min-width:0;}
.member-role-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(37,99,235,0.15);color:var(--primary-light);border:1px solid rgba(37,99,235,0.2);}
.member-remove-btn{background:transparent;border:none;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:6px;transition:color 0.2s;}
.member-remove-btn:hover{color:var(--error);}

/* ===== PROFILE MODAL ===== */
.profile-header-img{
  width:100%;height:140px;
  background:linear-gradient(135deg,#0d1424,#1a2744);
  position:relative;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:0;
}
.profile-avatar-big{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary-dark),var(--primary-light));
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:700;color:#fff;
  border:3px solid var(--surface);
  position:absolute;bottom:-36px;
  overflow:hidden;
}
.profile-avatar-big img{width:100%;height:100%;object-fit:cover;}
.profile-body{padding:48px 20px 20px;text-align:center;}
.profile-username{font-size:18px;font-weight:800;margin-bottom:4px;}
.profile-email{font-size:13px;color:var(--text-muted);}
.profile-actions{display:flex;gap:8px;margin-top:16px;justify-content:center;}

/* ===== BACK BUTTON ===== */
.back-btn{
  display:none;border:none;background:transparent;
  color:var(--primary);cursor:pointer;padding:6px;
  border-radius:8px;transition:all 0.2s;
  align-items:center;justify-content:center;
}
.back-btn:hover{background:rgba(37,99,235,0.1);}

/* ===== FOCUS ===== */
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

/* ===== MOBILE BOTTOM NAV ===== */
.mobile-nav{display:none;}
@media(max-width:768px){
  /* Bottom glass nav bar */
  .mobile-nav{
    display:flex;align-items:center;justify-content:space-around;
    position:fixed;bottom:0;left:0;right:0;
    height:calc(62px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(13,13,22,0.78);
    backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    border-top:1px solid rgba(255,255,255,0.07);
    z-index:50;
    box-shadow:0 -8px 32px rgba(0,0,0,0.45);
  }
  .mobile-nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;padding:8px 0;cursor:pointer;
    color:var(--text-muted);transition:color 0.2s ease;
    background:transparent;border:none;position:relative;
  }
  .mobile-nav-item .nav-icon{
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    border-radius:10px;transition:all 0.2s ease;
  }
  .mobile-nav-item .nav-label{font-size:10px;font-weight:600;letter-spacing:0.2px;transition:color 0.2s;}
  .mobile-nav-item.active{color:var(--primary);}
  .mobile-nav-item.active .nav-icon{
    background:rgba(37,99,235,0.15);
    box-shadow:0 0 14px rgba(37,99,235,0.25);
  }
  .mobile-nav-item:active .nav-icon{transform:scale(0.88);}

  /* Hide sidebar header on mobile, show only nav */
  .sidebar-header{display:none;}
  .sidebar-tabs{display:none;}

  /* Adjust sidebar to not overlap nav */
  .app{position:relative;}
  .sidebar{
    width:100%;min-width:0;position:absolute;
    top:0;left:0;right:0;
    bottom:calc(62px + env(safe-area-inset-bottom));
    z-index:20;height:auto;
  }
  .sidebar.hide-mobile{transform:translateX(-100%);}
  .chat-window{width:100%;}
  .message-row{max-width:84%;}
  .back-btn{display:flex;}
  .messages{padding:10px 12px;}
  .emoji-picker{width:290px;right:8px;}

  /* Chat window also respect nav height */
  .chat-active{padding-bottom:0;}
  .message-form{padding-bottom:max(10px,env(safe-area-inset-bottom));}
}
@media(max-width:480px){
  .auth-card{padding:28px 20px;}
  .message-row{max-width:90%;}
  .emoji-picker{width:calc(100vw - 24px);left:12px;right:12px;}
  .poll-creator{width:calc(100vw - 32px);left:50%;transform:translateX(-50%);}
}

/* ===== CHAT CONTEXT MENU ===== */
.chat-ctx-menu {
  position: fixed;
  background: rgba(18,18,30,0.97);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 14px;
  padding: 6px;
  min-width: 190px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.7);
  z-index: 9999;
  animation: popIn 0.15s ease;
}
.chat-ctx-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 9px;
  font-size: 14px; font-weight: 500; color: var(--text-primary);
  cursor: pointer; transition: background 0.12s; border: none;
  background: transparent; width: 100%; text-align: left;
  font-family: inherit;
}
.chat-ctx-item:hover { background: rgba(255,255,255,0.07); }
.chat-ctx-item.danger { color: #f87171; }
.chat-ctx-item.danger:hover { background: rgba(239,68,68,0.13); }
.chat-ctx-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 4px 0; }

/* ===== PINNED MESSAGE BAR ===== */
.pinned-bar{
  display:flex;align-items:center;gap:10px;
  padding:7px 14px;background:rgba(168,85,247,0.07);
  border-top:2px solid rgba(168,85,247,0.35);
  border-bottom:1px solid var(--border);flex-shrink:0;
  cursor:pointer;transition:background 0.15s;
}
.pinned-bar:hover{background:rgba(168,85,247,0.12);}
.pinned-bar-icon{color:#c084fc;flex-shrink:0;display:flex;}
.pinned-bar-content{flex:1;min-width:0;}
.pinned-bar-label{font-size:10.5px;font-weight:700;color:#c084fc;margin-bottom:1px;text-transform:uppercase;letter-spacing:0.5px;}
.pinned-bar-text{font-size:12.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pinned-bar-close{background:transparent;border:none;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:6px;display:flex;transition:color 0.2s;flex-shrink:0;}
.pinned-bar-close:hover{color:var(--error);}

/* ===== VIEWS COUNT ===== */
.views-count{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10.5px;color:var(--text-muted);
}
.views-count svg{opacity:0.7;}

/* ===== DISABLED OVERLAY HINT ===== */
.channel-feature-disabled{
  font-size:10.5px;color:var(--text-muted);font-style:italic;padding:2px 0;
}

/* ===== UNREAD BADGE ===== */
.unread-badge{
  min-width:19px;height:19px;border-radius:10px;
  background:var(--primary);color:#fff;
  font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  padding:0 5px;flex-shrink:0;margin-left:5px;
  box-shadow:0 2px 8px rgba(37,99,235,0.4);
  animation:popIn 0.2s ease;
}
.unread-badge.muted{background:var(--text-muted);}

/* ===== PIN ICON on chat row ===== */
.row-pin-icon{
  color:rgba(168,85,247,0.7);flex-shrink:0;margin-left:3px;
  display:inline-flex;align-items:center;
}
.user-row.pinned-row{
  background:rgba(168,85,247,0.04);
  border-left:2px solid rgba(168,85,247,0.3);
}
.user-row.pinned-row:hover{background:rgba(168,85,247,0.08);}

/* ===== READ RECEIPT TICKS ===== */
.msg-tick{
  display:inline-flex;align-items:center;margin-left:2px;
  transition:color 0.3s ease;
}
.msg-tick.seen{color:#60a5fa;}
.msg-tick.delivered{color:var(--text-muted);}

/* Archive section */
.archive-toggle {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 14px; cursor: pointer;
  font-size: 13px; font-weight: 600; color: var(--text-secondary);
  transition: color 0.15s; user-select: none; flex-shrink: 0;
}
.archive-toggle:hover { color: var(--text-primary); }
.archive-toggle svg { opacity: 0.7; transition: transform 0.2s; flex-shrink:0; }
.archive-toggle.open svg { transform: rotate(180deg); }
.archive-badge {
  margin-left: auto;
  background: var(--primary);
  color: #fff; font-size: 10px; font-weight: 700;
  padding: 1px 7px; border-radius: 20px; min-width: 18px; text-align: center;
}
#archived-list { flex-shrink: 0; }
</style>

<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="brand">
  
        <!-- Replace this with your logo by adding: <img src="your-logo.png" alt="Logo"> -->
         <img class="brand-logo-img" id="brand-logo-wrap" src="1.png">

    </div>

    <div class="auth-tabs" role="tablist">
      <button id="tab-login" class="auth-tab active" role="tab" aria-selected="true">Login</button>
      <button id="tab-signup" class="auth-tab" role="tab" aria-selected="false">Sign Up</button>
    </div>

    <form id="login-form" class="auth-form" aria-label="Login form">
      <div class="input-group">
        <input type="email" id="login-email" placeholder="Email" required autocomplete="email">
        <label for="login-email">Email</label>
      </div>
      <div class="input-group pw-group">
        <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
        <label for="login-password">Password</label>
        <button type="button" class="pw-toggle" onclick="togglePw('login-password',this)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button type="submit" class="btn-primary"><span>Sign In</span></button>
      <p class="auth-error" id="login-error" role="alert"></p>
    </form>

    <form id="signup-form" class="auth-form hidden">
      <div class="input-group">
        <input type="text" id="signup-username" placeholder="Username" required autocomplete="username">
        <label for="signup-username">Username</label>
      </div>
      <div class="input-group">
        <input type="email" id="signup-email" placeholder="Email" required autocomplete="email">
        <label for="signup-email">Email</label>
      </div>
      <div class="input-group pw-group">
        <input type="password" id="signup-password" placeholder="Password (min 6 chars)" required autocomplete="new-password">
        <label for="signup-password">Password</label>

function formatTime(ts) {
  if (!ts || !ts.toDate) return '';
  return ts.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatListTime(ts) {
  if (!ts || !ts.toDate) return '';
  const d = ts.toDate(), now = new Date();
  if (d.toDateString() === now.toDateString())
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function getChatId(a, b) { return [a, b].sort().join('_'); }

function friendlyError(err) {
  if (!err || !err.code) return 'Something went wrong.';
  const map = {
    'auth/email-already-in-use': 'This email is already registered.',
    'auth/invalid-email': 'Invalid email address.',
    'auth/weak-password': 'Password should be at least 6 characters.',
    'auth/user-not-found': 'No account found with this email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Invalid email or password.',
    'auth/too-many-requests': 'Too many attempts. Try again later.',
    'permission-denied': 'Permission denied.'
  };
  return map[err.code] || err.message || 'Unexpected error.';
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

signupForm.addEventListener('submit', async e => {
  e.preventDefault();
  signupError.textContent = '';
  const username = document.getElementById('signup-username').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const btn = signupForm.querySelector('.btn-primary');
  if (!username || username.length < 3) { signupError.textContent = 'Username must be at least 3 characters.'; return; }
  const usernameLower = username.toLowerCase();
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const existing = await db.collection('users').where('username_lower','==',usernameLower).limit(1).get();
    if (!existing.empty) { signupError.textContent = 'Username already taken.'; return; }
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection('users').doc(cred.user.uid).set({
      uid: cred.user.uid, username, username_lower: usernameLower, email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      online: true, lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
      photoURL: null
    });
    signupForm.reset();
  } catch(err) {
    signupError.textContent = friendlyError(err);
  } finally {
    btn.disabled = false; btn.textContent = 'Create Account';
  }
});

auth.onAuthStateChanged(async user => {
  cleanupListeners();
  if (user) {
    currentUser = user;
    const ref = db.collection('users').doc(user.uid);
    const snap = await ref.get();
    if (!snap.exists) {
      await ref.set({
        uid: user.uid, username: user.email.split('@')[0],
        username_lower: user.email.split('@')[0].toLowerCase(), email: user.email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        online: true, lastSeen: firebase.firestore.FieldValue.serverTimestamp(), photoURL: null
      });
    } else {
      await ref.update({ online: true, lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
    }
    currentUserData = (await ref.get()).data();
    renderMe();
    showApp();
    listenToChatsList();
    window.addEventListener('beforeunload', setOffline);
  } else {
    currentUser = null; currentUserData = null;
    activeChatId = null; activeChatPartner = null;
    showAuth();
  }
});

}

/* ===== BUILD USER ROW ===== */
function buildUserRow(u, subText, showDot, timeText, isGroup, badgeLabel, unreadCount, isPinned) {
  const row = document.createElement('div');
  row.className = 'user-row' + (isPinned ? ' pinned-row' : '');
  row.setAttribute('tabindex', '0');

  const wrap = document.createElement('div');
  wrap.className = 'avatar-wrap';
  const av = document.createElement('div');
  av.className = 'avatar';
  setAvatarContent(av, u.username || u.name, isGroup ? u.photoURL : u.photoURL);
  wrap.appendChild(av);

  if (showDot && !isGroup) {
    const dot = document.createElement('span');
    dot.className = 'status-dot' + (u.online ? ' online' : '');
    wrap.appendChild(dot);
  }

  const body = document.createElement('div');
  body.className = 'user-row-body';
  const top = document.createElement('div');
  top.className = 'user-row-top';
  const name = document.createElement('span');
  name.className = 'user-row-name';
  name.textContent = u.username || u.name;
  top.appendChild(name);

  // Pin icon next to name
  if (isPinned) {
    const pinIco = document.createElement('span');
    pinIco.className = 'row-pin-icon';
    pinIco.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24z"/></svg>`;
    top.appendChild(pinIco);
  }

  if (isGroup) {
    const badge = document.createElement('span');
    badge.className = badgeLabel === 'Channel' ? 'group-badge channel-badge' : 'group-badge';
    badge.textContent = badgeLabel || 'Group';
    top.appendChild(badge);
  }

  // Time + unread badge (right side)
  const rightSide = document.createElement('div');
  rightSide.style.cssText = 'display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;margin-left:6px;';

  if (timeText) {
    const t = document.createElement('span');
    t.className = 'user-row-time';
    t.style.marginLeft = '0';
    t.textContent = timeText;
    rightSide.appendChild(t);
  }

  if (unreadCount && unreadCount > 0) {
    const badge = document.createElement('span');
    badge.className = 'unread-badge';
    badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
    rightSide.appendChild(badge);
    // Bold the name when unread
    name.style.color = '#fff';
  }

  if (timeText || (unreadCount && unreadCount > 0)) {
    top.appendChild(rightSide);
  }

  const sub = document.createElement('span');
  sub.className = 'user-row-sub';
  // Bold sub text if unread
  if (unreadCount && unreadCount > 0) sub.style.color = 'var(--text-primary)';
  sub.textContent = subText || '';
  body.appendChild(top);
  body.appendChild(sub);
  row.appendChild(wrap);
  row.appendChild(body);
  row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') row.click(); });
  return row;
}
